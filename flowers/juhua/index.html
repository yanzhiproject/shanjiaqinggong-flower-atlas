<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f1e7"><title>&#12298;&#23665;&#23478;&#28165;&#20379;&#12299;&#33738;&#33457;&#31687; &middot; &#20116;&#31456;&#23436;&#25972;&#20114;&#21160;</title><link rel="stylesheet" href="../../assets/ui/sjq-sound-control.css"><script src="../../assets/ui/sjq-sound-control.js" defer></script><style>:root{--paper:#f7f1e7;--card:#fffdf8;--green:#6f7959}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}.chapter-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease-out}.chapter-frame.active{opacity:1;visibility:visible;pointer-events:auto}.loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--paper);color:var(--green);font:16px/1.7 Georgia,"Noto Serif SC","Songti SC",serif;transition:opacity .18s ease-out}.loading.hide{opacity:0;pointer-events:none}.loading span{padding:12px 20px;border:1px solid rgba(199,159,93,.3);border-radius:999px;background:var(--card)}.juhua-sound{position:fixed;right:max(22px,env(safe-area-inset-right));top:16px;z-index:100}</style></head><body><div class="sjq-sound-dock sjq-sound-dock--header juhua-sound" aria-label="背景音乐控制"><button class="sjq-sound-control" type="button" data-sjq-sound-toggle data-audio-target="#siteBgm" aria-label="播放山林清音" aria-pressed="false"><span class="sjq-sound-bars" aria-hidden="true"><i></i><i></i><i></i></span></button><span class="sjq-sound-tip" data-sjq-sound-tip aria-hidden="true">启清音</span></div><audio class="sjq-bgm-audio" id="siteBgm" data-sjq-bgm loop preload="metadata" src="../../assets/audio/bgm.mp3"></audio><div class="loading" id="loading"><span>&#33738;&#33457;&#31687; &middot; &#23637;&#21367;</span></div><iframe class="chapter-frame" id="identifyFrame"></iframe><iframe class="chapter-frame" id="recipeFrame"></iframe><iframe class="chapter-frame" id="storyFrame"></iframe><iframe class="chapter-frame" id="poetryFrame"></iframe><iframe class="chapter-frame" id="meaningFrame"></iframe><script>
(()=>{
  const frames={identify:identifyFrame,recipe:recipeFrame,story:storyFrame,poetry:poetryFrame,meaning:meaningFrame};
  const urls={identify:'identify.html?v=20260824-3',recipe:'recipe.html?v=20260824-3',story:'story.html?v=20260824-3',poetry:'poetry.html?v=20260824-3',meaning:'meaning.html?v=20260824-3'};
  const loaded={identify:false,recipe:false,story:false,poetry:false,meaning:false};
  const prefetched=new Set();
  const order=['identify','recipe','story','poetry','meaning'];
  let current='',loadingTimer=0;

  function stop(section){
    if(!section)return;
    try{
      frames[section].contentWindow.SJQStopAudio?.();
      frames[section].contentWindow.speechSynthesis?.cancel();
    }catch(error){}
  }

  function warmNext(section){
    const next=order[order.indexOf(section)+1];
    if(!next||loaded[next]||prefetched.has(next))return;
    prefetched.add(next);
    const warm=()=>fetch(urls[next],{cache:'force-cache'}).catch(()=>{});
    if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1800});
    else setTimeout(warm,900);
  }

  function finishLoading(section){
    loaded[section]=true;
    clearTimeout(loadingTimer);
    loading.classList.add('hide');
    warmNext(section);
  }

  function show(section,push=true){
    if(!frames[section])return;
    const old=current;
    current=section;
    Object.entries(frames).forEach(([key,frame])=>frame.classList.toggle('active',key===section));
    if(old!==section)stop(old);
    if(!loaded[section]){
      clearTimeout(loadingTimer);
      loading.classList.remove('hide');
      const frame=frames[section];
      frame.onload=()=>finishLoading(section);
      frame.src=urls[section];
      // 图片仍在渐进载入时先开放页面，避免遮罩长时间阻塞阅读。
      loadingTimer=setTimeout(()=>loading.classList.add('hide'),850);
    }else{
      loading.classList.add('hide');
    }
    if(push)history.replaceState(null,'','#'+section);
  }

  window.SJQShow=show;
  addEventListener('message',event=>{
    if(event.data?.type==='sjq-section')show(event.data.section);
    if(event.data?.type==='openChrysanthemumRecipeChapter')show('recipe');
    if(event.data?.type==='returnChrysanthemumIdentify')show('identify');
    if(event.data?.type==='returnFlowerAtlas'){
      if(parent!==window)parent.postMessage({type:'returnFlowerAtlas'},'*');
      else location.href='../../index.html?home=1';
    }
  });
  const hash=location.hash.slice(1);
  show(frames[hash]?hash:'identify',false);
})();
</script></body></html>

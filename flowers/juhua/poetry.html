let current="tao", lineIndex=0, deepIndex=0;

const selectScreen=document.getElementById("selectScreen");
const readerScreen=document.getElementById("readerScreen");
const deepScreen=document.getElementById("deepScreen");
const linesEl=document.getElementById("lines"), img=document.getElementById("visualImg"), cap=document.getElementById("visualCaption");
const note=document.getElementById("notePop");

function showScreen(id){[selectScreen,readerScreen,deepScreen].forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function openPoem(id){stopPoemAudio();current=id;lineIndex=0;renderReader();showScreen("readerScreen")}
document.querySelectorAll(".poem-ticket").forEach(b=>b.onclick=()=>openPoem(b.dataset.poem));
document.getElementById("backSelect").onclick=()=>{stopPoemAudio();showScreen("selectScreen")};document.getElementById("backStory").onclick=()=>{stopPoemAudio();parent.postMessage({type:"sjq-section",section:"story"},"*")};

function renderReader(){
 const p=poems[current];
 document.getElementById("poemMeta").textContent=p.meta;
 document.getElementById("poemTitle").textContent=p.title;
 document.getElementById("poemMotif").textContent=p.motif;
 linesEl.innerHTML="";
 p.lines.forEach((l,i)=>{const d=document.createElement("div");d.className="line"+(i===lineIndex?" active":"");d.innerHTML=l.html;d.onclick=()=>{lineIndex=i;renderReader()};linesEl.appendChild(d)});
 [...linesEl.querySelectorAll(".kw")].forEach(k=>{const open=e=>{e.stopPropagation();showNote(k,e)};k.onclick=open;k.onpointerenter=open;k.onpointerleave=()=>{clearTimeout(window.__noteTimer);window.__noteTimer=setTimeout(()=>note.classList.remove("show"),280)}});
 const L=p.lines[lineIndex];
 cap.textContent=L.cap;
 img.style.opacity="0";
 setTimeout(()=>{img.src=L.img||IMG; img.style.objectPosition="50% 50%"; img.style.filter="none"; img.style.transform="scale(1.015)"; img.style.opacity="1";},120);
 document.getElementById("visualIndex").textContent=`${String(lineIndex+1).padStart(2,"0")} / ${String(p.lines.length).padStart(2,"0")}`;
 document.getElementById("lineProgress").innerHTML=p.lines.map((_,i)=>`<span class="${i<=lineIndex?"on":""}"></span>`).join("");
 document.getElementById("prevLine").disabled=lineIndex===0;
 document.getElementById("nextLine").textContent=lineIndex===p.lines.length-1?"进入深读":"下一句";
}
function showNote(k,e){
 const text=poems[current].notes[k.dataset.note]||"";
 note.textContent=text;note.classList.add("show");
 const r=k.getBoundingClientRect();note.style.left=Math.min(window.innerWidth-350,Math.max(18,r.left))+"px";
 note.style.top=Math.min(window.innerHeight-170,r.bottom+10)+"px";
 clearTimeout(window.__noteTimer);window.__noteTimer=setTimeout(()=>note.classList.remove("show"),1600)
}
document.getElementById("prevLine").onclick=()=>{if(lineIndex>0){lineIndex--;renderReader()}};
document.getElementById("nextLine").onclick=()=>{const p=poems[current];if(lineIndex<p.lines.length-1){lineIndex++;renderReader()}else{openDeep()}};
document.getElementById("audioBtn").onclick=async()=>{const b=document.getElementById("audioBtn");if(!poemAudio.paused){poemAudio.pause();b.textContent="继续听";b.classList.remove("audio-playing");return}const track=POEM_AUDIO[current];if(poemAudio.dataset.track!==track){poemAudio.src=track;poemAudio.dataset.track=track;poemAudio.currentTime=0}try{await poemAudio.play();b.textContent="暂停诵读";b.classList.add("audio-playing")}catch(e){b.textContent="听诵读"}};

function openDeep(){deepIndex=0;renderDeep();showScreen("deepScreen")}
document.getElementById("backReader").onclick=()=>showScreen("readerScreen");
function renderDeep(){
 const p=poems[current];
 document.getElementById("deepMeta").textContent=p.meta+" · "+p.title;
 document.getElementById("deepTitle").textContent=p.deepTitle;
 document.getElementById("deepLead").textContent=p.lead;
 document.getElementById("deepSeal").textContent=p.seal;
 document.getElementById("deepSteps").innerHTML=p.deep.map((t,i)=>`<div class="deep-step ${i===deepIndex?"active":""}"><p>${t}</p>${i===p.deep.length-1?`<span class="deep-seal">${p.seal}</span>`:""}</div>`).join("");
 document.getElementById("deepProgress").innerHTML=p.deep.map((_,i)=>`<span class="${i<=deepIndex?"on":""}"></span>`).join("");
 document.getElementById("deepPrev").disabled=deepIndex===0;
 document.getElementById("deepNext").textContent=deepIndex===p.deep.length-1?"品意蕴 →":"下一步 →";
 document.getElementById("deepCaption").textContent=deepIndex===0?"先从诗句出发，再慢慢走向菊花背后的精神价值。":deepIndex===1?"意象并不是标签，而是在诗句与生活之间慢慢生成。":"到这里，菊已经从“可食之花”进入人的精神世界。";
 const deepImgs=current==="tao"?[DRINK3,DRINK4,DRINK5]:[JUYE1,JUYE3,JUYE4];
 const dimg=document.getElementById("deepImg");
 dimg.style.opacity="0";
 setTimeout(()=>{dimg.src=deepImgs[deepIndex];dimg.style.objectPosition="50% 50%";dimg.style.filter="none";dimg.style.transform="scale(1.015)";dimg.style.opacity="1";},120);
}
document.getElementById("deepPrev").onclick=()=>{if(deepIndex>0){deepIndex--;renderDeep()}};
document.getElementById("deepNext").onclick=()=>{const p=poems[current];if(deepIndex<p.deep.length-1){deepIndex++;renderDeep()}else{stopPoemAudio();parent.postMessage({type:"sjq-section",section:"meaning"},"*")}};
document.addEventListener("keydown",e=>{
 if(readerScreen.classList.contains("active")){if(e.key==="ArrowRight")document.getElementById("nextLine").click();if(e.key==="ArrowLeft")document.getElementById("prevLine").click()}
 if(deepScreen.classList.contains("active")){if(e.key==="ArrowRight")document.getElementById("deepNext").click();if(e.key==="ArrowLeft")document.getElementById("deepPrev").click()}
});
</script>
<script>
(()=>{
  const send=section=>parent.postMessage({type:'sjq-section',section},'*');
  const bind=(el,section)=>{if(!el||el.dataset.sjqFourBound)return;el.dataset.sjqFourBound='1';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.style.cursor='pointer';const go=e=>{e.preventDefault();e.stopImmediatePropagation();send(section)};el.addEventListener('click',go,true);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){go(e)}},true)};
  document.querySelectorAll('.chapter-nav span,.nav span,.pill-nav button').forEach(el=>{const text=el.textContent.trim();if(text==='\u8bc6\u540d\u7269')bind(el,'identify');if(text==='\u770b\u83dc\u8c31')bind(el,'recipe');if(text==='\u8bfb\u6545\u4e8b')bind(el,'story');if(text==='\u8d4f\u8bd7\u8bcd')bind(el,'poetry')});
  bind(document.getElementById('toRecipe'),'recipe');
})();
</script><script>
(()=>{const send=section=>parent.postMessage({type:'sjq-section',section},'*');const bind=(el,section)=>{if(!el)return;el.dataset.sjqFiveBound='1';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('onclick',`event.preventDefault();event.stopImmediatePropagation();parent.postMessage({type:'sjq-section',section:'${section}'},'*')`);el.style.cursor='pointer';el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();send(section)}},true)};document.querySelectorAll('.chapter-nav span,.nav span,.pill-nav button').forEach(old=>{const t=old.textContent.trim(),section=t==='\u8bc6\u540d\u7269'?'identify':t==='\u770b\u83dc\u8c31'?'recipe':t==='\u8bfb\u6545\u4e8b'?'story':t==='\u8d4f\u8bd7\u8bcd'?'poetry':t==='\u54c1\u610f\u8574'?'meaning':'';if(!section)return;const el=old.cloneNode(true);old.replaceWith(el);bind(el,section)});const oldNext=document.getElementById('toRecipe');if(oldNext){const next=oldNext.cloneNode(true);oldNext.replaceWith(next);bind(next,'recipe')}})();
</script></body>

const STORY_AUDIO=["assets/asset-022-239af34e0c.mp3","assets/asset-023-f56157509e.mp3","assets/asset-024-aa797aed5a.mp3","assets/asset-025-d6cc90b102.mp3","assets/asset-026-fbf5c280c6.mp3"];
const storyAudio=new Audio();
function stopStoryAudio(){storyAudio.pause();storyAudio.currentTime=0;const b=document.getElementById('audioBtn');if(b)b.textContent='▶ 听原文'};window.SJQStopAudio=stopStoryAudio;storyAudio.addEventListener('ended',()=>{document.getElementById('audioBtn').textContent='▶ 听原文'});
const stories=[{"num": "01", "title": "春游西马塍", "image": "assets/asset-017-838a961712.webp", "original": "春游西马塍，会张将使元耕轩，留饮。", "narrative": "春日里，林洪来到西马塍游赏。花田之间，他恰好遇见张元将使，于是被留下饮酒。故事从一次春游与相逢开始。", "keywords": {"西马塍": "浙江余杭一带的著名花圃之地，宋代以种花闻名。", "留饮": "主人邀客留下饮酒，是文人交游中自然的一环。"}, "hotspots": [{"x": 36, "y": 56, "title": "林洪", "text": "故事从“游”开始。林洪只是春日来到花田闲游。"}, {"x": 79, "y": 42, "title": "相逢", "text": "远处的人影暗示下一步的相逢与留饮。"}]}, {"num": "02", "title": "一赋一兰", "image": "assets/asset-018-e5ef42bf0e.webp", "original": "命予作《菊田赋》诗，作墨兰。", "narrative": "席间，张元将使请林洪为眼前的菊田赋诗，又请他画一枝墨兰。游赏因此变成了一场文人雅集。", "keywords": {"菊田赋": "林洪应主人之请，以眼前菊田为题作赋。", "墨兰": "以水墨写兰，是文人借花寄意的一种雅事。"}, "hotspots": [{"x": 48, "y": 54, "title": "墨兰", "text": "画案上的墨兰，让“吃”之前先有诗画之雅。"}, {"x": 44, "y": 44, "title": "诗赋", "text": "诗、画与花田共同构成这次相聚的前半段。"}]}, {"num": "03", "title": "数杯之后", "image": "assets/asset-019-24b38956a4.webp", "original": "元甚喜，数杯后，出菊煎。", "narrative": "张元将使见诗与墨兰，很是欢喜。两人又饮了数杯。直到这时，菊煎才被端上来。", "keywords": {"数杯后": "这三个字说明先有相聚、诗画与饮酒，食物随后才出现。", "菊煎": "以鲜嫩菊苗为主料制成的清雅花馔。"}, "hotspots": [{"x": 33, "y": 50, "title": "菊煎初现", "text": "这一幕才第一次出现菊煎：它是相聚渐入佳境后的自然一味。"}, {"x": 57, "y": 59, "title": "数杯之后", "text": "酒杯让“数杯后”的时间顺序变得可见。"}]}, {"num": "04", "title": "菊苗入馔", "image": "assets/asset-020-c7cbc226b6.webp", "original": "法：采菊苗，汤瀹，用甘草水调山药粉，煎之以油。", "narrative": "鲜嫩菊苗先用热水焯过，再以甘草水调和山药粉，最后用油煎成。做法简洁，却嵌在春游、花田、朋友与诗画之间。", "keywords": {"汤瀹": "“瀹”有煮、焯之意，这里指用热水处理菊苗。", "甘草水": "以甘草煮水，用来调和山药粉。", "山药粉": "调成糊后裹住菊苗，再入油煎。"}, "hotspots": [{"x": 51, "y": 60, "title": "一味菊苗", "text": "此处的食物不是独立的“菜品展示”，而仍属于这场雅集。"}]}, {"num": "05", "title": "楚畹之风", "image": "assets/asset-021-9c83731eb6.webp", "original": "爽然有楚畹之风。张，深于药者，亦谓“菊以紫茎为正”云。", "narrative": "林洪没有以“香”“酥”“鲜”收尾，而说“爽然有楚畹之风”。一味菊苗留下的，是花田、诗赋、墨兰、朋友相逢与春日清风。", "keywords": {"爽然": "清爽、舒畅的感受。", "楚畹": "泛指兰圃，也带有《楚辞》式的幽芳与清雅意象。", "紫茎为正": "当时关于甘菊品类的一种辨识观念。"}, "hotspots": [{"x": 29, "y": 58, "title": "兰意", "text": "“楚畹”把味觉带回兰圃般的幽芳与清气。"}, {"x": 61, "y": 41, "title": "余韵", "text": "最后留下的不是“吃了什么”，而是一整段春日生活。"}]}];

const btns=[...document.querySelectorAll('.scene-btn')];
const imgs=[...document.querySelectorAll('[data-img]')];
const rt=document.getElementById('rt'),orig=document.getElementById('original'),annotation=document.getElementById('annotation'),nar=document.getElementById('narrative'),emphasis=document.getElementById('emphasis'),prog=document.getElementById('progress'),sceneLabel=document.getElementById('sceneLabel'),sceneCount=document.getElementById('sceneCount'),hotspotLayer=document.getElementById('hotspotLayer'),hotspotNote=document.getElementById('hotspotNote');
const emphasisText=[
  '故事从“游”开始，而不是从一道菜开始。',
  '在菊煎出现之前，先有诗，先有画。',
  '“数杯后”三个字，把食物放回了相聚的时间顺序里。',
  '一味菊苗，是这场春日雅集中的一环。',
  '入口的是菊，留下的是一段春日生活。'
];
function renderOriginal(s){
  let text=s.original;
  const terms=Object.keys(s.keywords).sort((a,b)=>b.length-a.length);
  terms.forEach(term=>{text=text.split(term).join(`<span class="term" data-term="${term}">${term}</span>`)});
  orig.innerHTML=text;
  orig.querySelectorAll('.term').forEach(el=>el.addEventListener('click',()=>{
    const already=el.classList.contains('active');
    orig.querySelectorAll('.term').forEach(x=>x.classList.remove('active'));
    if(already){annotation.classList.remove('show');annotation.textContent='';return}
    el.classList.add('active');annotation.textContent=s.keywords[el.dataset.term];annotation.classList.add('show');
  }));
}
function renderHotspots(s){
  hotspotLayer.innerHTML='';hotspotNote.classList.remove('show');hotspotNote.textContent='';
  (s.hotspots||[]).forEach(h=>{
    const b=document.createElement('button');b.className='hotspot';b.style.left=h.x+'%';b.style.top=h.y+'%';b.setAttribute('aria-label',h.title);
    b.addEventListener('click',()=>{
      [...hotspotLayer.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');hotspotNote.innerHTML='<b>'+h.title+'</b><br>'+h.text;hotspotNote.classList.add('show');
    });hotspotLayer.appendChild(b);
  })
}
function render(i){stopStoryAudio();
  current=i;const s=stories[i];
  btns.forEach((b,j)=>b.classList.toggle('active',j===i));imgs.forEach((im,j)=>im.classList.toggle('active',j===i));
  rt.style.opacity=.18;nar.style.opacity=.18;sceneLabel.style.opacity=.2;
  setTimeout(()=>{
    rt.textContent=s.title;nar.textContent=s.narrative;emphasis.textContent=emphasisText[i];renderOriginal(s);annotation.textContent='';annotation.classList.remove('show');
    prog.innerHTML=stories.map((_,j)=>'<i class="'+(j<=i?'on':'')+'"></i>').join('');sceneLabel.textContent='第'+['一','二','三','四','五'][i]+'幕 · '+s.title;sceneCount.textContent=s.num+' / 05';
    const prevBtn=document.getElementById('prev');prevBtn.style.visibility='visible';prevBtn.innerHTML=i===0?'<span>\u2190</span> \u8fd4\u56de\u83dc\u8c31':'<span>\u2190</span> \u4e0a\u4e00\u5e55';document.getElementById('next').innerHTML=i===stories.length-1?'\u8d4f\u8bd7\u8bcd <span>\u2192</span>':'\u4e0b\u4e00\u5e55 <span>\u2192</span>';
    renderHotspots(s);rt.style.opacity=1;nar.style.opacity=1;sceneLabel.style.opacity=1;
  },150)
}
btns.forEach((b,i)=>b.addEventListener('click',()=>render(i)));
document.getElementById('prev').addEventListener('click',()=>{if(current>0)render(current-1);else parent.SJQShow('recipe')});
document.getElementById('next').addEventListener('click',()=>{if(current<stories.length-1)render(current+1);else parent.SJQShow('poetry')});
document.getElementById('audioBtn').addEventListener('click',async()=>{const b=document.getElementById('audioBtn');if(!storyAudio.paused){storyAudio.pause();b.textContent='▶ 继续听';return}const track=STORY_AUDIO[current];if(storyAudio.dataset.track!==track){storyAudio.src=track;storyAudio.dataset.track=track;storyAudio.currentTime=0}try{await storyAudio.play();b.textContent='Ⅱ 暂停'}catch(e){b.textContent='▶ 听原文'}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&current<stories.length-1)render(current+1);if(e.key==='ArrowLeft'&&current>0)render(current-1)});
const stage=document.getElementById('stage');
stage.addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;const im=imgs[current];im.style.transform=`scale(1.006) translate(${-x*3}px,${-y*2}px)`});
stage.addEventListener('mouseleave',()=>{imgs[current].style.transform=''});
const nav=document.getElementById('pillNav'),slider=nav.querySelector('.slider');function moveSlider(){const active=nav.querySelector('button.active'),nr=nav.getBoundingClientRect(),r=active.getBoundingClientRect();slider.style.left=(r.left-nr.left)+'px';slider.style.width=r.width+'px'}requestAnimationFrame(moveSlider);addEventListener('resize',moveSlider);
render(0);
</script>
<script>
(()=>{
  const send=section=>parent.postMessage({type:'sjq-section',section},'*');
  const bind=(el,section)=>{
    if(!el)return;
    el.setAttribute('role','button');el.setAttribute('tabindex','0');el.style.cursor='pointer';
    const go=e=>{e.preventDefault();e.stopImmediatePropagation();send(section)};
    el.addEventListener('click',go,true);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){go(e)}},true);
  };
  document.querySelectorAll('.chapter-nav span,.nav span,.pill-nav button').forEach(el=>{
    const text=el.textContent.trim();
    if(text==='\u8bc6\u540d\u7269')bind(el,'identify');
    if(text==='\u770b\u83dc\u8c31')bind(el,'recipe');
    if(text==='\u8bfb\u6545\u4e8b')bind(el,'story');
  });
  bind(document.getElementById('toRecipe'),'recipe');
})();
</script><script>
(()=>{
  const send=section=>parent.postMessage({type:'sjq-section',section},'*');
  const bind=(el,section)=>{if(!el||el.dataset.sjqFourBound)return;el.dataset.sjqFourBound='1';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.style.cursor='pointer';const go=e=>{e.preventDefault();e.stopImmediatePropagation();send(section)};el.addEventListener('click',go,true);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){go(e)}},true)};
  document.querySelectorAll('.chapter-nav span,.nav span,.pill-nav button').forEach(el=>{const text=el.textContent.trim();if(text==='\u8bc6\u540d\u7269')bind(el,'identify');if(text==='\u770b\u83dc\u8c31')bind(el,'recipe');if(text==='\u8bfb\u6545\u4e8b')bind(el,'story');if(text==='\u8d4f\u8bd7\u8bcd')bind(el,'poetry')});
  bind(document.getElementById('toRecipe'),'recipe');
})();
</script><script>
(()=>{const send=section=>parent.postMessage({type:'sjq-section',section},'*');const bind=(el,section)=>{if(!el)return;el.dataset.sjqFiveBound='1';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('onclick',`event.preventDefault();event.stopImmediatePropagation();parent.postMessage({type:'sjq-section',section:'${section}'},'*')`);el.style.cursor='pointer';el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();send(section)}},true)};document.querySelectorAll('.chapter-nav span,.nav span,.pill-nav button').forEach(old=>{const t=old.textContent.trim(),section=t==='\u8bc6\u540d\u7269'?'identify':t==='\u770b\u83dc\u8c31'?'recipe':t==='\u8bfb\u6545\u4e8b'?'story':t==='\u8d4f\u8bd7\u8bcd'?'poetry':t==='\u54c1\u610f\u8574'?'meaning':'';if(!section)return;const el=old.cloneNode(true);old.replaceWith(el);bind(el,section)});const oldNext=document.getElementById('toRecipe');if(oldNext){const next=oldNext.cloneNode(true);oldNext.replaceWith(next);bind(next,'recipe')}})();
</script></body>
</html>

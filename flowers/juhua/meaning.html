<title>《山家清供》· 菊花 · 第五章 品意蕴</title>
<style>
:root {
  --paper: #F6EFDF;
  --ink: #2A231C;
  --muted: #8A7A68;
  --gold: #C59A53;
  --seal-red: #A83829;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif; color: var(--ink); background: #F5EEDC; }

/* ===== 1. 顶栏 ===== */
.topbar {
  position: fixed; left: 0; right: 0; top: 0; height: 68px; padding: 0 34px; z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center;
  border-bottom: 1px solid rgba(197, 154, 83, 0.12);
  background: linear-gradient(180deg, rgba(251, 248, 242, 0.85), rgba(251, 248, 242, 0.3));
  backdrop-filter: blur(12px);
}
.brand { font-size: 13px; letter-spacing: .16em; color: #6B5D4C; }
.chapter { justify-self: end; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.chapter-nav { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 4px; min-width: 450px; border-radius: 999px; background: rgba(255,255,255,.45); border: 1px solid rgba(197, 154, 83, 0.15); }
.chapter-nav::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 80%; width: 20%; border-radius: 999px; background: rgba(197, 154, 83, 0.75); }
.chapter-nav span { position: relative; z-index: 1; text-align: center; padding: 7px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chapter-nav .active { color: #FFFDF8; }

/* ===== 2. 沉浸画布与背景 ===== */
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#petalCanvas { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

.ambient-glow {
  position: absolute; width: 60vw; height: 60vw; max-width: 750px; max-height: 750px;
  background: radial-gradient(circle, rgba(255, 253, 247, 0.9) 0%, rgba(245, 233, 212, 0.25) 55%, transparent 75%);
  border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); left: 50%; top: 48%;
  animation: breathe 8s ease-in-out infinite alternate;
}
@keyframes breathe {
  0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.9; }
}

.mountain-bg { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; opacity: 0.07; pointer-events: none; }

/* ===== 4. 核心文字（节奏适中） ===== */
.poem-box {
  position: relative; z-index: 10; max-width: 820px; width: 84vw; text-align: center; padding-top: 28px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.poem-box.out { opacity: 0; transform: translateY(-12px); filter: blur(4px); }

.poem-line {
  font-size: clamp(16px, 1.4vw, 22px);
  line-height: 1.6;
  font-weight: 400;
  letter-spacing: 0.28em;
  color: #382F26;
  margin: 0;
  opacity: 0;
  transform: translateY(14px);
  filter: blur(6px);
  /* 淡入动画缩短到 1.2 秒，显现更自然 */
  transition: opacity 1.65s ease, transform 1.65s cubic-bezier(0.16, 1, 0.3, 1), filter 1.65s ease;
}

.poem-line.first-line {
  font-size: clamp(20px, 1.8vw, 28px);
  font-weight: 500;
  color: #1F1914;
  margin-bottom: 6px;
  letter-spacing: 0.32em;
}

.poem-line.topic-line {
  font-size: 11px;
  line-height: 1.4;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 0.34em;
  margin-bottom: 8px;
}
.poem-line.hero-line {
  font-size: clamp(25px, 2.4vw, 38px);
  line-height: 1.45;
  font-weight: 500;
  color: #1F1914;
  letter-spacing: 0.16em;
  margin-bottom: 10px;
}
.poem-line.closing-line {
  font-size: clamp(18px, 1.55vw, 24px);
  color: #7A5A2E;
  font-weight: 500;
  letter-spacing: 0.16em;
  margin-top: 8px;
}
.poem-box.final-page{
  transform: translateY(18px);
  gap: 14px;
}
.poem-box.final-page .poem-line{
  font-size: clamp(14px, 1.16vw, 18px);
  line-height: 1.5;
  letter-spacing: 0.20em;
}
.poem-box.final-page .hero-line{
  font-size: clamp(22px, 2.05vw, 32px);
  line-height: 1.3;
  margin-bottom: 6px;
}
.poem-box.final-page .closing-line{
  font-size: clamp(16px, 1.34vw, 21px);
  margin-top: 6px;
}


.poem-line.last-line {
  color: #1A140E;
  font-weight: 500;
}

.poem-line.show { opacity: 1; transform: translateY(0); filter: blur(0); }




/* ===== 5. 底部指示器 ===== */
.dock-bar {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 8px; pointer-events: none;
}
.dock-dot {
  width: 5px; height: 5px; border-radius: 50%; background: rgba(197, 154, 83, 0.18);
  transition: all 0.4s ease;
}
.dock-dot.active { width: 18px; border-radius: 999px; background: rgba(197,154,83,.72); }

/* 完结层 */
.finish-screen {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, #FBF8F2 0%, #EFE3CE 100%); opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 1.2s ease;
}
.finish-screen.show { opacity: 1; visibility: visible; }
.finish-title { font-size: 36px; font-weight: 400; letter-spacing: 0.3em; color: var(--ink); margin-top: 12px;}

.finish-actions{
  margin-top:28px;
  display:flex;
  justify-content:center;
  gap:12px;
}
.finish-btn{
  border-radius:999px;
  padding:10px 18px;
  font-size:12px;
  letter-spacing:.08em;
  cursor:pointer;
  transition:transform .22s ease,background .22s ease,box-shadow .22s ease;
}
.finish-btn:hover{transform:translateY(-1px)}
.finish-btn.secondary{
  border:1px solid rgba(197,154,83,.22);
  background:rgba(255,253,248,.72);
  color:#6B5D4C;
}
.finish-btn.primary{
  border:0;
  background:linear-gradient(180deg,#D8B97D,#C49B55);
  color:#fff;
  box-shadow:0 9px 20px rgba(121,89,39,.16);
}

<body>

<header class="topbar">
  <div class="brand">《山家清供》花馔图鉴</div>
  <nav class="chapter-nav">
    <span>识名物</span><span>看菜谱</span><span>读故事</span><span>赏诗词</span><span class="active">品意蕴</span>
  </nav>
  <div class="chapter">第五章 · 品意蕴 · 菊花</div>
</header>

<div class="stage" id="stage">
  <!-- 花瓣与微粒 Canvas -->
  <canvas id="petalCanvas"></canvas>

  <div class="ambient-glow"></div>
  
  
  

  <svg class="mountain-bg" viewBox="0 0 1600 400" preserveAspectRatio="none">
    <path d="M0,340 C180,270 260,300 410,240 C560,176 650,252 790,206 C930,160 1025,228 1170,190 C1320,150 1450,208 1600,145 L1600,400 L0,400 Z" fill="#6B5D4C"/>
  </svg>

  <main class="poem-box" id="poemBox"></main>
</div>

<div class="dock-bar" id="dockBar"></div><div class="meaning-controls" id="meaningControls"><button class="meaning-nav-btn" id="meaningPrevBtn">← 返回赏诗词</button><button class="meaning-nav-btn primary" id="meaningNextBtn">下一句 →</button></div>


<div class="finish-screen" id="finishScreen">
  <div style="text-align:center;">
    <div style="font-size:11px; letter-spacing:0.35em; color:var(--gold);">《山家清供》· 菊花篇</div>
    <div class="finish-title">完</div>
    <div class="finish-actions">
      <button class="finish-btn secondary" id="backPoetryBtn">回看菊花之旅</button>
      <button class="finish-btn primary" id="backIndexBtn">返回花馔图鉴</button>
    </div>
  </div>
</div>
</div>

<script>
const pagesData = [
  {
    type: "hero",
    lines: [
      "一朵菊 最后留下了什么",
      "菊可以入口",
      "也可以顺着时节进入日常",
      "吃到的不只是味道",
      "也是山野与季节的气息"
    ]
  },
  {
    type: "topic",
    topic: "相聚",
    lines: [
      "春游 作诗 画兰 饮酒",
      "几杯之后 菊煎才被端上来",
      "它不是这场相聚的目的",
      "却让这一刻多了一份可以记住的味道"
    ]
  },
  {
    type: "topic",
    topic: "品格",
    lines: [
      "霜后仍开",
      "篱下自守",
      "林洪从一首菊诗里",
      "看出了一个人的清介品格"
    ]
  },
  {
    type: "topic",
    topic: "慢下来",
    lines: [
      "采菊只是日常里的一件小事",
      "抬头时 南山已经在眼前",
      "当人不再一直向外追赶",
      "平常的生活也会有自己的安静"
    ]
  },
  {
    type: "final",
    lines: [
      "最后 留下的是一种生活",
      "它从山野来到餐桌",
      "从一次相聚走进记忆",
      "又从诗里变成一种品格和心境",
      "所以菊花的价值",
      "从来不只是可以吃 可以赏",
      "它也提醒我们",
      "在四时变化里感受生活",
      "在平常日子里找到自己的节奏",
      "把四时风物 过成自己的日常"
    ],
    isFinal: true
  }
];

let currentIndex = 0;
let currentLine = -1;
let animationTimers = [];
let autoAdvanceTimer = null;
let transitionLocked = false;

const poemBox = document.getElementById("poemBox");
const dockBar = document.getElementById("dockBar");
const finishScreen = document.getElementById("finishScreen");
const stage = document.getElementById("stage");

function clearTimers() {
  animationTimers.forEach(clearTimeout);
  animationTimers = [];
  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = null;
}

function renderDots() {
  dockBar.innerHTML = "";
  pagesData.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dock-dot" + (i === currentIndex ? " active" : "");
    dockBar.appendChild(dot);
  });
}

function updateMeaningControls(){const p=document.getElementById("meaningPrevBtn"),n=document.getElementById("meaningNextBtn");if(!p||!n)return;p.textContent=currentIndex===0?"← 返回赏诗词":"← 上一页";const d=pagesData[currentIndex];n.textContent=currentLine<d.lines.length-1?"下一句 →":d.isFinal?"完成":"下一页 →"} function buildPage() {
  clearTimers();
  transitionLocked = false;
  currentLine = -1;

  const data = pagesData[currentIndex];
  poemBox.classList.toggle("final-page", !!data.isFinal);

  const blocks = [];
  if (data.type === "topic" && data.topic) {
    blocks.push(`<p class="poem-line topic-line" id="line-topic">${data.topic}</p>`);
  }

  data.lines.forEach((line, i) => {
    let extraClass = "";
    if ((data.type === "hero" || data.type === "final") && i === 0) {
      extraClass = "hero-line";
    } else if (data.type === "final" && i === data.lines.length - 1) {
      extraClass = "closing-line";
    } else if (i === data.lines.length - 1) {
      extraClass = "last-line";
    }
    blocks.push(`<p class="poem-line ${extraClass}" id="line-${i}">${line}</p>`);
  });

  poemBox.innerHTML = blocks.join("");
  renderDots();updateMeaningControls();

  // If a topic word exists, let it appear first, then start the sentences.
  if (data.type === "topic" && data.topic) {
    animationTimers.push(setTimeout(() => {
      document.getElementById("line-topic")?.classList.add("show");
    }, 420));
    animationTimers.push(setTimeout(() => revealNextLine(), 1800));
  } else {
    animationTimers.push(setTimeout(() => revealNextLine(), 650));
  }
}

function revealNextLine(force = false) {
  clearTimeout(autoAdvanceTimer);
  const data = pagesData[currentIndex];

  if (currentLine < data.lines.length - 1) {
    currentLine++;
    const line = document.getElementById(`line-${currentLine}`);
    line?.classList.add("show");updateMeaningControls();

    // Normal automatic rhythm: title / first sentence stays slightly longer.
    let wait = 2450;
    if (currentLine === 0 && (data.type === "hero" || data.type === "final")) wait = 3000;
    else if (currentLine >= 1) wait = 2200;

    autoAdvanceTimer = setTimeout(() => revealNextLine(), wait);
    return;
  }

  // This page is fully visible. Pause before automatically turning the page.
  const pause = data.isFinal ? 5200 : 3800;
  autoAdvanceTimer = setTimeout(() => {
    if (data.isFinal) showFinish();
    else goToPage(currentIndex + 1);
  }, pause);
}

function goToPage(targetIndex) {
  if (transitionLocked) return;
  if (targetIndex < 0 || targetIndex >= pagesData.length) return;

  transitionLocked = true;
  clearTimers();
  poemBox.classList.add("out");

  setTimeout(() => {
    currentIndex = targetIndex;
    poemBox.classList.remove("out");
    buildPage();
  }, 520);
}

function handleAdvanceClick() {
  if (transitionLocked || finishScreen.classList.contains("show")) return;

  const data = pagesData[currentIndex];

  // If there are hidden sentences left, a click immediately reveals the next sentence.
  if (currentLine < data.lines.length - 1) {
    clearTimeout(autoAdvanceTimer);
    revealNextLine(true);
    return;
  }

  // If the whole page is already visible, a click goes straight to the next page.
  if (data.isFinal) showFinish();
  else goToPage(currentIndex + 1);
}

function showFinish() {
  clearTimers();
  finishScreen.classList.add("show");document.getElementById("meaningControls")?.setAttribute("hidden","");
}

// Main interaction: automatic playback + click-to-accelerate.
stage.addEventListener("click", handleAdvanceClick);
stage.addEventListener("touchend", (e) => {
  e.preventDefault();
  handleAdvanceClick();
}, { passive:false });

// Keep wheel and keyboard only as secondary controls.
let isWheeling = false;
document.addEventListener("wheel", (e) => {
  if (isWheeling || finishScreen.classList.contains("show")) return;
  isWheeling = true;
  if (e.deltaY > 20) handleAdvanceClick();
  else if (e.deltaY < -20 && currentIndex > 0) goToPage(currentIndex - 1);
  setTimeout(() => isWheeling = false, 600);
}, { passive:true });

document.addEventListener("keydown", (e) => {
  if (finishScreen.classList.contains("show")) return;
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    handleAdvanceClick();
  }
  if (e.key === "ArrowLeft" && currentIndex > 0) {
    goToPage(currentIndex - 1);
  }
});

// End-screen navigation.
// When embedded in the complete atlas, these hooks can be intercepted by the parent page.
// Standalone preview falls back to a hash / reload-friendly behavior.
document.getElementById("backPoetryBtn")?.addEventListener("click", () => {
  if (typeof window.SJQShow === "function") {
    window.SJQShow("poetry");
    return;
  }
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({type:"sjq-section", section:"poetry"}, "*");
    return;
  }
  history.back();
});

document.getElementById("backIndexBtn")?.addEventListener("click", () => {
  if (typeof window.SJQShow === "function") {
    window.SJQShow("identify");
    return;
  }
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({type:"sjq-section", section:"identify"}, "*");
    return;
  }
  location.hash = "identify";
  location.reload();
});

// ===== 菊花花瓣飘落特效 Canvas =====
const canvas = document.getElementById("petalCanvas");
const ctx = canvas.getContext("2d");
let petals = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class Petal {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -20;
    this.size = Math.random() * 8 + 6;
    this.speedY = Math.random() * 0.34 + 0.18;
    this.speedX = Math.random() * 0.26 - 0.13;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.008;
    this.opacity = Math.random() * 0.22 + 0.10;
    const colors = [
      'rgba(225, 185, 105, ',
      'rgba(210, 160, 80, ',
      'rgba(240, 210, 140, '
    ];
    this.colorBase = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.y += this.speedY;
    this.x += Math.sin(this.y * 0.01) * 0.35 + this.speedX;
    this.angle += this.spin;
    if (this.y > canvas.height + 20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.beginPath();
    ctx.moveTo(0, -this.size);
    ctx.quadraticCurveTo(this.size * 0.4, 0, 0, this.size);
    ctx.quadraticCurveTo(-this.size * 0.4, 0, 0, -this.size);
    ctx.fillStyle = this.colorBase + this.opacity + ')';
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < 10; i++) {
  const p = new Petal();
  p.y = Math.random() * canvas.height;
  petals.push(p);
}

function animatePetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animatePetals);
}
animatePetals();

buildPage();
</script>
<script>

<body>
  <div class="app"><header class="topbar"><div class="brand">《山家清供》花馔图鉴</div><nav class="nav" aria-label="章节导航"><span>识名物</span><span class="active">看菜谱</span><span>读故事</span><span>赏诗词</span><span>品意蕴</span></nav><div class="chapter">第二章 · 看菜谱</div></header>
    <main class="main">

<script>
(()=>{

  };

  });

})();

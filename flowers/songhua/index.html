      &lt;div class=&quot;tags&quot;&gt;
        &lt;span class=&quot;tag reveal&quot; data-reveal=&quot;3&quot;&gt;时令 · 二三月&lt;/span&gt;
        &lt;span class=&quot;tag reveal&quot; data-reveal=&quot;4&quot;&gt;山林食材&lt;/span&gt;

      &lt;p id=&quot;modelInfoText&quot;&gt;从动态画面整体观察叶部、花部与芽部之间的空间关系。&lt;/p&gt;

        &lt;button data-model-tab=&quot;flower&quot;&gt;花部&lt;/button&gt;

      &lt;/div&gt;

    &lt;div class=&quot;options&quot;&gt;
      &lt;button data-ok=&quot;0&quot;&gt;梅花&lt;/button&gt;
      &lt;button data-ok=&quot;1&quot;&gt;松花&lt;/button&gt;
      &lt;button data-ok=&quot;0&quot;&gt;桂花&lt;/button&gt;
      &lt;button data-ok=&quot;0&quot;&gt;栀子&lt;/button&gt;

&lt;script&gt;
const stage=document.getElementById(&#x27;stage&#x27;);
const lens=document.getElementById(&#x27;lens&#x27;);
const spots=[...document.querySelectorAll(&#x27;.hotspot&#x27;)];
const callouts=[...document.querySelectorAll(&#x27;.callout&#x27;)];
const boxes=callouts.map(c=&gt;c.querySelector(&#x27;.box&#x27;));
const bars=[...document.querySelectorAll(&#x27;.progress i&#x27;)];
const status=document.getElementById(&#x27;status&#x27;);
const clearPlant=document.getElementById(&#x27;clearPlant&#x27;);
const chapterOverlay=document.getElementById(&#x27;chapterOverlay&#x27;);
const guideOverlay=document.getElementById(&#x27;guideOverlay&#x27;);
const quizOverlay=document.getElementById(&#x27;quizOverlay&#x27;);
const feedback=document.getElementById(&#x27;feedback&#x27;);
const modelOverlay=document.getElementById(&#x27;modelOverlay&#x27;);
const openModelBtn=document.getElementById(&#x27;openModelBtn&#x27;);
const modelCloseBtn=document.getElementById(&#x27;modelCloseBtn&#x27;);
const modelContinueBtn=document.getElementById(&#x27;modelContinueBtn&#x27;);
const pineModel=document.getElementById(&#x27;pineModel&#x27;);
const modelInfoTitle=document.getElementById(&#x27;modelInfoTitle&#x27;);
const modelInfoText=document.getElementById(&#x27;modelInfoText&#x27;);
const modelFocusTag=document.getElementById(&#x27;modelFocusTag&#x27;);
const pineModelVideo=document.getElementById(&#x27;pineModelVideo&#x27;);

let step=0;
let enabled=false;
let waiting=false;
let pointerInside=false;
let lastPointer={x:0,y:0};
let dwellTimer=null;
let dwellTarget=-1;

function cancelDwell(){
  if(dwellTimer){
    clearTimeout(dwellTimer);
    dwellTimer=null;
  }
  dwellTarget=-1;
}

setTimeout(()=&gt;{
  chapterOverlay.classList.remove(&#x27;show&#x27;);
  setTimeout(()=&gt;guideOverlay.classList.add(&#x27;show&#x27;),350);
},2200);

document.getElementById(&#x27;startBtn&#x27;).onclick=()=&gt;{
  guideOverlay.classList.remove(&#x27;show&#x27;);
  enabled=true;
  status.textContent=&#x27;请移动放大镜，仔细寻找松针。&#x27;;
  if(pointerInside) lens.style.opacity=&#x27;1&#x27;;
};


function reveal(i){
  cancelDwell();
  enabled=false;
  waiting=true;
  stage.classList.add(&#x27;reading&#x27;);
  lens.style.opacity=&#x27;0&#x27;;
  spots.forEach((s,n)=&gt;s.classList.toggle(&#x27;active&#x27;,n===i));
  callouts.forEach((c,n)=&gt;c.classList.toggle(&#x27;show&#x27;,n===i));
  bars[i].classList.add(&#x27;on&#x27;);
  status.textContent=&#x27;已发现：&#x27;+[&#x27;松针&#x27;,&#x27;松花花序&#x27;,&#x27;松芽&#x27;][i];
}

callouts.forEach((c,i)=&gt;c.querySelector(&#x27;button&#x27;).onclick=()=&gt;{
  c.classList.remove(&#x27;show&#x27;);
  spots[i].classList.remove(&#x27;active&#x27;);
  waiting=false;
  stage.classList.remove(&#x27;reading&#x27;);
  step++;
  if(step===1) status.textContent=&#x27;请继续移动放大镜，寻找松花花序。&#x27;;
  if(step===2) status.textContent=&#x27;最后，请用放大镜寻找顶部松芽。&#x27;;
  if(step===3){
    clearPlant.style.opacity=&#x27;1&#x27;;
    status.textContent=&#x27;三处特征已识。现在可以从立体视角继续观察。&#x27;;
    setTimeout(()=&gt;openModelBtn.classList.add(&#x27;show&#x27;),520);
  }else{
    enabled=true;
    /* 用户点击“知道了”后，不必移出再移入，放大镜立即恢复。 */
    if(pointerInside){
      lens.style.left=lastPointer.x+&#x27;px&#x27;;
      lens.style.top=lastPointer.y+&#x27;px&#x27;;
      requestAnimationFrame(()=&gt;lens.style.opacity=&#x27;1&#x27;);
    }
  }
});

function move(e){
  const r=stage.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  lastPointer={x,y};
  lens.style.left=x+&#x27;px&#x27;;
  lens.style.top=y+&#x27;px&#x27;;

  const s=154, imgLeft=r.width*.10, imgTop=r.height*.10;
  const imgW=r.width*.80, imgH=r.height*.80;
  lens.style.backgroundSize=imgW+&#x27;px &#x27;+imgH+&#x27;px&#x27;;
  lens.style.backgroundPosition=(s/2-(x-imgLeft))+&#x27;px &#x27;+(s/2-(y-imgTop))+&#x27;px&#x27;;

  if(!enabled || waiting || step&gt;2){
    cancelDwell();
    return;
  }

  const q=spots[step].getBoundingClientRect();
  const sx=q.left-r.left+q.width/2, sy=q.top-r.top+q.height/2;
  const insideTarget=Math.hypot(x-sx,y-sy)&lt;48;

  if(insideTarget){
    if(dwellTarget!==step){
      cancelDwell();
      dwellTarget=step;
      status.textContent=&#x27;请保持放大镜停留片刻，仔细观察这一处……&#x27;;
      dwellTimer=setTimeout(()=&gt;{
        if(enabled &amp;&amp; !waiting &amp;&amp; dwellTarget===step) reveal(step);
      },850);
    }
  }else{
    if(dwellTarget===step){
      cancelDwell();
      status.textContent=[
        &#x27;请移动放大镜，仔细寻找松针。&#x27;,
        &#x27;请继续移动放大镜，寻找松花花序。&#x27;,
        &#x27;最后，请用放大镜寻找顶部松芽。&#x27;
      ][step] || &#x27;请继续观察。&#x27;;
    }
  }
}

stage.onmouseenter=()=&gt;{
  pointerInside=true;
  if(enabled){
    lens.style.left=lastPointer.x+&#x27;px&#x27;;
    lens.style.top=lastPointer.y+&#x27;px&#x27;;
    lens.style.opacity=&#x27;1&#x27;;
  }
};
stage.onmouseleave=()=&gt;{
  pointerInside=false;
  cancelDwell();
  lens.style.opacity=&#x27;0&#x27;;
};
stage.onmousemove=move;


const modelNotes={
  all:{title:&#x27;整体&#x27;,text:&#x27;从动态画面整体观察叶部、花部与芽部的组合关系，先建立完整印象。&#x27;,focus:&#x27;当前观察：整体&#x27;},
  needle:{title:&#x27;叶部&#x27;,text:&#x27;叶部即松针，细长如针，自枝条基部向外舒展，是辨认松类植物的重要特征。&#x27;,focus:&#x27;当前观察：叶部&#x27;},
  flower:{title:&#x27;花部&#x27;,text:&#x27;花部即黄色花序，集中簇生，是松花粉产生与采集的关键部位，也是“松黄”之来源。&#x27;,focus:&#x27;当前观察：花部&#x27;},
  bud:{title:&#x27;芽部&#x27;,text:&#x27;芽部即松芽，位于枝条顶端，代表新枝萌发生长，是整体结构中富有生机的一部分。&#x27;,focus:&#x27;当前观察：芽部&#x27;}
};
openModelBtn.onclick=()=&gt;{modelOverlay.classList.add(&#x27;show&#x27;); if(modelFocusTag) modelFocusTag.textContent=modelNotes.all.focus; modelInfoTitle.textContent=modelNotes.all.title; modelInfoText.textContent=modelNotes.all.text; document.querySelectorAll(&#x27;[data-model-tab]&#x27;).forEach((item,index)=&gt;item.classList.toggle(&#x27;active&#x27;,index===0)); if(pineModelVideo){pineModelVideo.currentTime=0; pineModelVideo.play().catch(()=&gt;{});}};
modelCloseBtn.onclick=()=&gt;modelOverlay.classList.remove(&#x27;show&#x27;);
modelContinueBtn.onclick=()=&gt;{
  modelOverlay.classList.remove(&#x27;show&#x27;);
  setTimeout(()=&gt;quizOverlay.classList.add(&#x27;show&#x27;),260);
};
document.querySelectorAll(&#x27;[data-model-tab]&#x27;).forEach(btn=&gt;{
  btn.onclick=()=&gt;{
    document.querySelectorAll(&#x27;[data-model-tab]&#x27;).forEach(item=&gt;item.classList.remove(&#x27;active&#x27;));
    btn.classList.add(&#x27;active&#x27;);
    const data=modelNotes[btn.dataset.modelTab];
    modelInfoTitle.textContent=data.title;
    modelInfoText.textContent=data.text;
    if(modelFocusTag) modelFocusTag.textContent=data.focus;
  };
});


document.querySelectorAll(&#x27;[data-ok]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{
  if(b.dataset.ok===&#x27;1&#x27;){
    feedback.textContent=&#x27;正是松花。&#x27;;
    setTimeout(()=&gt;{
      quizOverlay.classList.remove(&#x27;show&#x27;);
      const explorePage=document.getElementById(&#x27;explorePage&#x27;);
      const introScreen=document.getElementById(&#x27;introScreen&#x27;);
      const transitionNote=document.getElementById(&#x27;transitionNote&#x27;);

      explorePage.classList.add(&#x27;fade-out&#x27;);
      transitionNote.classList.add(&#x27;show&#x27;);

      setTimeout(()=&gt;{
        transitionNote.classList.remove(&#x27;show&#x27;);
        introScreen.classList.add(&#x27;show&#x27;,&#x27;ready&#x27;);

        const items=[...introScreen.querySelectorAll(&#x27;[data-reveal]&#x27;)];
        const delays=[400,900,1400,1900,2080,2260,2440,2950,3800,4900];
        items.forEach((item,index)=&gt;{
          setTimeout(()=&gt;item.classList.add(&#x27;visible&#x27;),delays[index]);
        });
        setTimeout(()=&gt;items.forEach(item=&gt;item.classList.add(&#x27;visible&#x27;)),6500);
      },850);
    },550);
  }else{
    feedback.textContent=&#x27;再想想它的松针、黄色花序和松芽。&#x27;;
  }
});

document.getElementById(&#x27;nextBtn&#x27;).onclick=function(){
  window.parent.postMessage({type:&#x27;openRecipeChapter&#x27;},&#x27;*&#x27;);
};
&lt;/script&gt;

.powder{width:38px;height:14px;border-radius:50%;background:#d3bf9d;position:relative}
.powder:after{content:&quot;&quot;;position:absolute;left:4px;right:4px;top:-7px;height:14px;border-radius:50%}
.rice:after{background:#eee6d7}.pine:after{background:#d6b45a}
.jar{width:29px;height:35px;border-radius:7px 7px 10px 10px;background:#d6ae60;position:relative}
.jar:before{content:&quot;&quot;;position:absolute;left:4px;right:4px;top:-5px;height:8px;background:#86643d;border-radius:4px}
.cup{width:30px;height:30px;border-radius:5px 5px 12px 12px;border:2px solid #b7c5c4;background:rgba(210,232,235,.55)}
.ingredient b{display:block;font-size:15px;font-weight:500}
.ingredient span{display:block;margin-top:3px;font-size:11px;color:var(--muted);line-height:1.5}
.note{
  margin-top:16px;padding:14px;border-radius:16px;
  background:rgba(182,143,72,.07);border:1px solid rgba(182,143,72,.13)
}
.note b{font-size:13px}.note p{margin:6px 0 0;font-size:12px;line-height:1.75;color:var(--muted)}

.viewer{
  position:relative;height:min(77vh,710px);
  overflow:hidden;border-radius:24px;
  border:1px solid rgba(182,143,72,.20);
  background:#e9dcc8;
  box-shadow:0 24px 65px rgba(67,49,23,.10)
}
.state-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.025);filter:blur(7px);
  transition:opacity .72s ease,transform 1.15s ease,filter .9s ease
}
.state-img.active{opacity:1;transform:scale(1);filter:blur(0)}
.state-img.leaving{opacity:0;transform:scale(.992);filter:blur(5px)}
.viewer:after{
  content:&quot;&quot;;position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(34,25,13,.03),transparent 38%,rgba(39,29,14,.14))
}
.top-controls{
  position:absolute;left:50%;top:20px;transform:translateX(-50%);
  z-index:6;display:flex;gap:10px
}
.top-controls button{
  padding:9px 15px;border-radius:999px;
  border:1px solid rgba(182,143,72,.28);
  background:rgba(255,250,240,.92);
  box-shadow:0 8px 20px rgba(62,45,21,.07);
  cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease
}
.top-controls button:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 11px 24px rgba(62,45,21,.10)
}
.top-controls button:active:not(:disabled){transform:scale(.97)}
.top-controls button:disabled{opacity:.35;cursor:default}
.caption{
  position:absolute;left:28px;bottom:22px;z-index:5;
  width:min(54%,560px);
  padding:12px 16px;border-radius:14px;
  background:rgba(250,245,235,.90);
  backdrop-filter:blur(10px);
  border:1px solid rgba(182,143,72,.20);
  box-shadow:0 12px 30px rgba(58,43,21,.10);
  transform:translateY(10px);
  opacity:0;
  transition:opacity .42s ease,transform .42s ease
}
.caption.ready{opacity:1;transform:translateY(0)}
.caption small,.caption h2,.caption .poem,.caption .desc{
  opacity:0;transform:translateY(7px)
}
.caption.ready small{animation:rise .35s ease forwards .06s}
.caption.ready h2{animation:rise .38s ease forwards .16s}
.caption.ready .poem{animation:rise .38s ease forwards .27s}
.caption.ready .desc{animation:rise .4s ease forwards .38s}
.caption small{display:block;color:var(--gold);font-size:10px;letter-spacing:.18em}
.caption h2{margin:4px 0 3px;font-size:22px;font-weight:500;letter-spacing:.05em}
.caption .poem{margin:0 0 4px;color:#6f5b3d;font-size:12px;letter-spacing:.05em}
.caption .desc{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

.right{padding:20px 15px;overflow:auto}
.step{
  display:grid;grid-template-columns:32px 1fr;gap:10px;
  padding:10px 9px;border-radius:14px;margin-bottom:8px;
  cursor:pointer;transition:.25s;border:1px solid transparent;
  position:relative
}
.step:not(:last-child)::after{
  content:&quot;&quot;;position:absolute;left:23px;top:43px;width:1px;height:17px;
  background:rgba(182,143,72,.22)
}
.step.done:not(:last-child)::after{
  background:var(--gold)
}
.step:hover{background:rgba(182,143,72,.06)}
.step.active{background:var(--green);color:#fff;border-color:#666f3c;transform:translateX(-3px)}
.step.active p{color:rgba(255,255,255,.76)}
.step.done{opacity:.7}
.step.next-pulse{animation:pulseStep 1.6s ease-in-out infinite}
@keyframes pulseStep{
  0%,100%{box-shadow:0 0 0 0 rgba(182,143,72,0)}
  50%{box-shadow:0 0 0 5px rgba(182,143,72,.10)}
}
.num{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(182,143,72,.30);font-size:12px
}
.step.active .num{border-color:rgba(255,255,255,.56)}
.step b{font-size:14px;font-weight:500}
.step p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
.finish{
  margin-top:13px;width:100%;padding:11px 14px;border-radius:999px;
  border:1px solid rgba(182,143,72,.28);background:#fffaf0;
  cursor:pointer;opacity:0;pointer-events:none;transition:.3s
}
.finish.show{opacity:1;pointer-events:auto}
footer{display:flex;align-items:center;justify-content:center;color:#998b76;font-size:11px;letter-spacing:.12em}

.overlay{

  background:rgba(45,36,24,.17);backdrop-filter:blur(7px);

}
.overlay.show{opacity:1;visibility:visible}
.card{
  width:min(560px,88vw);padding:30px 34px;border-radius:22px;
  text-align:center;background:rgba(251,247,238,.97);
  border:1px solid rgba(182,143,72,.30);
  box-shadow:0 28px 80px rgba(50,40,23,.18)
}
.card small{color:var(--gold);letter-spacing:.22em}
.card h1,.card h2{font-weight:500;letter-spacing:.1em;margin:10px 0 14px}
.card h1{font-size:38px}.card h2{font-size:28px}
.card p{font-size:14px;line-height:1.9;color:var(--muted);margin:8px 0 0}
.card button{
  margin-top:18px;padding:11px 22px;border-radius:999px;
  border:1px solid rgba(182,143,72,.32);background:#fffaf0;cursor:pointer
}
.recipe{text-align:left}
.recipe h3{margin:0 0 12px;font-size:30px;font-weight:500}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.recipe-box{padding:14px;border-radius:14px;background:rgba(182,143,72,.07);border:1px solid rgba(182,143,72,.16)}
.recipe-box b{display:block;margin-bottom:8px}
.recipe-box p{margin:0;font-size:13px;line-height:1.8}
@media(max-width:1100px){
  main{grid-template-columns:220px 1fr}
  .right{display:none}
}

.steam-overlay{
  position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s ease
}
.steam-overlay.show{opacity:1}
.steam-overlay i{
  position:absolute;bottom:20%;width:30px;height:130px;border-left:3px solid rgba(255,255,255,.55);
  border-radius:50%;animation:steamRise 2.7s ease-in-out infinite
}
.steam-overlay i:nth-child(1){left:40%}
.steam-overlay i:nth-child(2){left:51%;animation-delay:.5s}
.steam-overlay i:nth-child(3){left:61%;animation-delay:1s}
@keyframes steamRise{
  0%{transform:translateY(30px) scale(.8);opacity:0}
  35%{opacity:.65}
  100%{transform:translateY(-80px) scale(1.2);opacity:0}
}
.viewer.final-reveal .state-img.active{
  transform:scale(1.02);
}
.viewer.final-reveal .caption{
  box-shadow:0 16px 40px rgba(58,43,21,.16)
}
.page.enter .left,.page.enter .right{
  opacity:0;transform:translateY(10px)
}
.page.ready .left,.page.ready .right{
  opacity:1;transform:translateY(0);
  transition:opacity .6s ease,transform .6s ease
}
&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;page enter&quot; id=&quot;pageRoot&quot;&gt;
&lt;header&gt;
  &lt;div class=&quot;brand&quot;&gt;《山家清供》花馔图鉴&lt;/div&gt;
  &lt;div class=&quot;chapter&quot;&gt;第二章 · 看菜谱&lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;
  &lt;aside class=&quot;panel left&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;食材与用具&lt;/div&gt;
    &lt;div class=&quot;ingredient&quot;&gt;&lt;div class=&quot;pic&quot;&gt;&lt;div class=&quot;powder rice&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;糯米粉&lt;/b&gt;&lt;span&gt;糯米磨成的细粉，作为饼坯。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ingredient&quot;&gt;&lt;div class=&quot;pic&quot;&gt;&lt;div class=&quot;powder pine&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;松花粉&lt;/b&gt;&lt;span&gt;色泽金黄，带清雅松香。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ingredient&quot;&gt;&lt;div class=&quot;pic&quot;&gt;&lt;div class=&quot;jar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;蜂蜜&lt;/b&gt;&lt;span&gt;增添清甜，也帮助黏合。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;ingredient&quot;&gt;&lt;div class=&quot;pic&quot;&gt;&lt;div class=&quot;cup&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;清水&lt;/b&gt;&lt;span&gt;少量加入，调和成团。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/aside&gt;

  &lt;section class=&quot;viewer&quot; id=&quot;viewer&quot;&gt;
    &lt;div class=&quot;top-controls&quot;&gt;
      &lt;button id=&quot;prevBtn&quot;&gt;上一步&lt;/button&gt;
      &lt;button id=&quot;nextBtn&quot;&gt;下一步&lt;/button&gt;
    &lt;/div&gt;
    &lt;div id=&quot;images&quot;&gt;&lt;/div&gt;&lt;div class=&quot;steam-overlay&quot; id=&quot;steamOverlay&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;caption&quot; id=&quot;caption&quot;&gt;
      &lt;small id=&quot;small&quot;&gt;&lt;/small&gt;
      &lt;h2 id=&quot;title&quot;&gt;&lt;/h2&gt;
      &lt;p class=&quot;poem&quot; id=&quot;poem&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;desc&quot; id=&quot;desc&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;aside class=&quot;panel right&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;制作步骤&lt;/div&gt;
    &lt;div id=&quot;stepList&quot;&gt;&lt;/div&gt;
    &lt;button class=&quot;finish&quot; id=&quot;finishBtn&quot;&gt;查看完整食谱&lt;/button&gt;
  &lt;/aside&gt;
&lt;/main&gt;

&lt;footer&gt;糯米粉 · 松花粉 · 蜂蜜 · 清水 · 木模 · 蒸笼&lt;/footer&gt;
&lt;/div&gt;

&lt;div class=&quot;overlay show&quot; id=&quot;chapterOverlay&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;small&gt;第二章&lt;/small&gt;
    &lt;h1&gt;看菜谱&lt;/h1&gt;
    &lt;p&gt;循着松花的香气，看一味松黄如何成饼。&lt;/p&gt;
    &lt;button id=&quot;startBtn&quot;&gt;开始翻阅&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;overlay&quot; id=&quot;recipeOverlay&quot;&gt;
  &lt;div class=&quot;card recipe&quot;&gt;
    &lt;small&gt;山家食单&lt;/small&gt;
    &lt;h3&gt;松黄饼&lt;/h3&gt;
    &lt;div class=&quot;recipe-grid&quot;&gt;
      &lt;div class=&quot;recipe-box&quot;&gt;&lt;b&gt;食材&lt;/b&gt;&lt;p&gt;糯米粉、松花粉、蜂蜜、清水。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;recipe-box&quot;&gt;&lt;b&gt;做法&lt;/b&gt;&lt;p&gt;糯米粉与松花粉调匀，加入蜂蜜和少量清水调和成团，移至案板整理，压模成形后入笼蒸熟。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;button id=&quot;collectBtn&quot;&gt;收入山家食单&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const states=[{&quot;title&quot;: &quot;备好食材&quot;, &quot;desc&quot;: &quot;将糯米粉、松花粉、蜂蜜与清水备于案上，待次第入馔。&quot;, &quot;poem&quot;: &quot;一案清供，诸味初陈。&quot;, &quot;src&quot;: &quot;assets/asset-003-82c82f71f7.png&quot;}, {&quot;title&quot;: &quot;糯米粉入碗&quot;, &quot;desc&quot;: &quot;糯米粉先入木碗，作为松黄饼柔软细腻的饼坯。&quot;, &quot;poem&quot;: &quot;白粉先入，作饼之坯。&quot;, &quot;src&quot;: &quot;assets/asset-004-588f7b5a08.png&quot;}, {&quot;title&quot;: &quot;加入松花粉&quot;, &quot;desc&quot;: &quot;将金黄色松花粉加入糯米粉中，白与金尚未完全相和。&quot;, &quot;poem&quot;: &quot;松黄入碗，色渐如金。&quot;, &quot;src&quot;: &quot;assets/asset-005-c2e80e0feb.png&quot;}, {&quot;title&quot;: &quot;调匀粉料&quot;, &quot;desc&quot;: &quot;两种粉料调和均匀，颜色由白渐转为温润浅金。&quot;, &quot;poem&quot;: &quot;两粉相和，色泽匀润。&quot;, &quot;src&quot;: &quot;assets/asset-006-a3e6bb099b.png&quot;}, {&quot;title&quot;: &quot;加蜜与清水&quot;, &quot;desc&quot;: &quot;加入蜂蜜与少量清水，使松散粉料逐渐湿润、微微结块。&quot;, &quot;poem&quot;: &quot;少许蜜水，调粉成团。&quot;, &quot;src&quot;: &quot;assets/asset-007-56fa2c90cc.png&quot;}, {&quot;title&quot;: &quot;上案成团&quot;, &quot;desc&quot;: &quot;将调和后的粉料移至案板，整理成柔软圆润的面团。&quot;, &quot;poem&quot;: &quot;移至案上，揉压成团。&quot;, &quot;src&quot;: &quot;assets/asset-008-1d6c23d296.png&quot;}, {&quot;title&quot;: &quot;压模成形&quot;, &quot;desc&quot;: &quot;面团压入木模，形成带传统花纹的松黄饼生坯。&quot;, &quot;poem&quot;: &quot;入模轻压，饼样方成。&quot;, &quot;src&quot;: &quot;assets/asset-009-7536d3636e.png&quot;}, {&quot;title&quot;: &quot;入笼蒸制&quot;, &quot;desc&quot;: &quot;将成形生饼放入竹蒸笼，以柔和蒸汽慢慢蒸熟。&quot;, &quot;poem&quot;: &quot;置入蒸笼，静待熟成。&quot;, &quot;src&quot;: &quot;assets/asset-010-a35bbcd0b5.png&quot;}, {&quot;title&quot;: &quot;松黄饼成&quot;, &quot;desc&quot;: &quot;蒸熟后的松黄饼色泽淡金，纹样清晰，松香清远。&quot;, &quot;poem&quot;: &quot;色如淡金，松香清远。&quot;, &quot;src&quot;: &quot;assets/asset-011-bbaaa4ea9a.png&quot;}];
const images=document.getElementById(&#x27;images&#x27;);
const stepList=document.getElementById(&#x27;stepList&#x27;);
const title=document.getElementById(&#x27;title&#x27;);
const desc=document.getElementById(&#x27;desc&#x27;);
const poem=document.getElementById(&#x27;poem&#x27;);
const small=document.getElementById(&#x27;small&#x27;);
const prevBtn=document.getElementById(&#x27;prevBtn&#x27;);
const nextBtn=document.getElementById(&#x27;nextBtn&#x27;);
const finishBtn=document.getElementById(&#x27;finishBtn&#x27;);
const chapterOverlay=document.getElementById(&#x27;chapterOverlay&#x27;);
const recipeOverlay=document.getElementById(&#x27;recipeOverlay&#x27;);
const caption=document.getElementById(&#x27;caption&#x27;);
const viewer=document.getElementById(&#x27;viewer&#x27;);
const steamOverlay=document.getElementById(&#x27;steamOverlay&#x27;);
const pageRoot=document.getElementById(&#x27;pageRoot&#x27;);
let current=0;

states.forEach((s,i)=&gt;{
  const img=document.createElement(&#x27;img&#x27;);
  img.src=s.src;
  img.alt=s.title;
  img.className=&#x27;state-img&#x27;+(i===0?&#x27; active&#x27;:&#x27;&#x27;);
  images.appendChild(img);

  const step=document.createElement(&#x27;div&#x27;);
  step.className=&#x27;step&#x27;+(i===0?&#x27; active&#x27;:&#x27;&#x27;);
  step.innerHTML=&#x27;&lt;div class=&quot;num&quot;&gt;&#x27;+(i+1)+&#x27;&lt;/div&gt;&lt;div&gt;&lt;b&gt;&#x27;+s.title+&#x27;&lt;/b&gt;&lt;p&gt;&#x27;+s.desc+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
  step.onclick=()=&gt;show(i);
  stepList.appendChild(step);
});

function show(i){
  const nextIndex=Math.max(0,Math.min(states.length-1,i));
  const imgs=[...document.querySelectorAll(&#x27;.state-img&#x27;)];
  const stepEls=[...document.querySelectorAll(&#x27;.step&#x27;)];

  imgs.forEach((el,n)=&gt;{
    if(el.classList.contains(&#x27;active&#x27;) &amp;&amp; n!==nextIndex){
      el.classList.add(&#x27;leaving&#x27;);
      setTimeout(()=&gt;el.classList.remove(&#x27;active&#x27;,&#x27;leaving&#x27;),520);
    }
  });

  current=nextIndex;
  caption.classList.remove(&#x27;ready&#x27;);
  void caption.offsetWidth;

  setTimeout(()=&gt;{
    imgs.forEach((el,n)=&gt;el.classList.toggle(&#x27;active&#x27;,n===current));
    small.textContent=&#x27;步骤&#x27;+[&#x27;一&#x27;,&#x27;二&#x27;,&#x27;三&#x27;,&#x27;四&#x27;,&#x27;五&#x27;,&#x27;六&#x27;,&#x27;七&#x27;,&#x27;八&#x27;,&#x27;九&#x27;][current];
    title.textContent=states[current].title;
    poem.textContent=states[current].poem;
    desc.textContent=states[current].desc;
    caption.classList.add(&#x27;ready&#x27;);
  },120);

  stepEls.forEach((el,n)=&gt;{
    el.classList.toggle(&#x27;active&#x27;,n===current);
    el.classList.toggle(&#x27;done&#x27;,n&lt;current);
    el.classList.toggle(&#x27;next-pulse&#x27;,n===current+1);
  });

  prevBtn.disabled=current===0;
  nextBtn.disabled=current===states.length-1;
  finishBtn.classList.toggle(&#x27;show&#x27;,current===states.length-1);
  steamOverlay.classList.toggle(&#x27;show&#x27;,current===7 || current===8);
  viewer.classList.toggle(&#x27;final-reveal&#x27;,current===8);
}
prevBtn.onclick=()=&gt;show(current-1);
nextBtn.onclick=()=&gt;show(current+1);
finishBtn.onclick=()=&gt;recipeOverlay.classList.add(&#x27;show&#x27;);
document.getElementById(&#x27;startBtn&#x27;).onclick=()=&gt;{
  chapterOverlay.classList.remove(&#x27;show&#x27;);
  setTimeout(()=&gt;{
    pageRoot.classList.remove(&#x27;enter&#x27;);
    pageRoot.classList.add(&#x27;ready&#x27;);
    show(0);
  },280);
};
document.getElementById(&#x27;collectBtn&#x27;).onclick=function(){
  this.textContent=&#x27;已收入《山家食单》 · 正在进入故事&#x27;;
  this.disabled=true;
  setTimeout(()=&gt;window.parent.postMessage({type:&#x27;openStoryChapter&#x27;},&#x27;*&#x27;),650);
};
show(0);
&lt;/script&gt;

&lt;style&gt;
:root{--paper:#f6efe1;--ink:#40372c;--muted:#81715f;--gold:#b58e49;--green:#6d7445}

body{font-family:&quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,&quot;SimSun&quot;,serif;color:var(--ink);background:linear-gradient(180deg,#faf6ed,#f1e5d2)}
.page{height:100%;display:grid;grid-template-rows:64px 1fr 38px;padding:0 24px 12px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(181,142,73,.18)}
.brand{font-size:13px;letter-spacing:.16em}.chapter{font-size:12px;color:var(--muted);letter-spacing:.14em}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:center}
.nav,.scroll{height:min(79vh,730px);border:1px solid rgba(181,142,73,.18);border-radius:22px;background:rgba(255,252,246,.74);box-shadow:0 18px 52px rgba(64,45,20,.05)}
.nav{padding:18px 14px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:.2em;margin-bottom:15px}
.scene-btn{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 10px;margin-bottom:10px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:.25s}
.scene-btn:hover{background:rgba(181,142,73,.06)}.scene-btn.active{background:var(--green);color:white}
.scene-btn .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(181,142,73,.3);font-size:12px}
.scene-btn.active .n{border-color:rgba(255,255,255,.55)}.scene-btn b{font-size:14px;font-weight:500}.scene-btn p{margin:3px 0 0;font-size:11px;line-height:1.5;color:var(--muted)}.scene-btn.active p{color:rgba(255,255,255,.76)}

.stage{position:relative;height:min(79vh,730px);overflow:hidden;border-radius:24px;border:1px solid rgba(181,142,73,.2);box-shadow:0 24px 65px rgba(67,49,23,.10);background:#d9c7aa}
.stage .scene-image{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.025);filter:blur(5px);
  transition:opacity .72s ease,transform 1.1s ease,filter .85s ease
}
.stage .scene-image.active{
  opacity:1;transform:scale(1);filter:blur(0)
}
.stage.focus-children .scene-image.active{transform:scale(1.015)}
.stage.focus-chen .scene-image.active{transform:scale(1.025)}
.stage.focus-table .scene-image.active{transform:scale(1.015)}
.stage.focus-final .scene-image.active{transform:scale(1.02);filter:saturate(1.07) brightness(1.03)}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,21,11,.02),rgba(30,21,11,.14));pointer-events:none}
.bubble{
  position:absolute;z-index:5;max-width:38%;
  padding:16px 18px 16px 22px;border-radius:16px;
  background:rgba(248,241,226,.95);
  border:1px solid rgba(181,142,73,.25);
  box-shadow:0 14px 34px rgba(48,34,16,.15);
  opacity:0;transform:translateY(10px);
  transition:opacity .42s ease,transform .42s ease
}
.bubble::before{
  content:&quot;&quot;;position:absolute;left:0;top:15px;bottom:15px;width:3px;
  border-radius:0 3px 3px 0;background:var(--gold)
}
.bubble.show{opacity:1;transform:translateY(0)}
.bubble[style*=&quot;visibility: hidden&quot;]{pointer-events:none}
.bubble.left{
  left:6%;top:8%;right:auto
}
.bubble.right{
  right:6%;top:8%;left:auto
}
.bubble.child{
  left:5%;top:12%;right:auto;max-width:36%
}
.bubble small{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--gold);letter-spacing:.12em;margin-bottom:7px
}
.bubble small::before{
  content:&quot;&quot;;width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 4px rgba(181,142,73,.10)
}
.bubble p{margin:0;font-size:16px;line-height:1.75}
.bubble.show{opacity:1;transform:translateY(0)}
.bubble[style*=&quot;visibility: hidden&quot;]{pointer-events:none}.bubble small{display:block;color:var(--gold);letter-spacing:.14em;margin-bottom:5px}.bubble p{margin:0;font-size:16px;line-height:1.75}
.plain{
  position:absolute;left:5%;right:5%;bottom:24px;z-index:5;
  padding:16px 18px;border-radius:16px;
  background:rgba(248,241,226,.91);
  backdrop-filter:blur(10px);
  border:1px solid rgba(181,142,73,.22);
  box-shadow:0 12px 30px rgba(48,34,16,.12);
  opacity:0;
  transform:translateX(-46px);
  clip-path:inset(0 100% 0 0 round 16px);
  transition:opacity .5s ease,transform .72s cubic-bezier(.22,.8,.26,1),clip-path 1.05s cubic-bezier(.22,.8,.26,1)
}
.plain.show{
  opacity:1;
  transform:translateX(0);
  clip-path:inset(0 0 0 0 round 16px)
}.plain h2{margin:0 0 5px;font-size:24px;font-weight:500;letter-spacing:.06em}.plain p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}

.scroll{padding:20px 20px;position:relative;overflow:hidden}
.scroll::before{content:&quot;&quot;;position:absolute;inset:12px;border:1px solid rgba(181,142,73,.13);border-radius:16px;pointer-events:none}
.scroll h3{margin:0 0 15px;font-size:24px;font-weight:500;letter-spacing:.08em}
.quote{font-size:18px;line-height:2.05;position:relative;z-index:2}
.quote .annot{border-bottom:1px dashed rgba(181,142,73,.65);cursor:pointer;transition:.2s}
.quote .annot:hover{color:#7c622e;background:rgba(181,142,73,.08)}
.note{position:absolute;left:22px;right:22px;bottom:22px;padding:14px 16px;border-radius:15px;background:#fffaf0;border:1px solid rgba(181,142,73,.22);box-shadow:0 14px 34px rgba(48,34,16,.12);opacity:0;transform:translateY(8px);pointer-events:none;transition:.3s}
.note.show{opacity:1;transform:translateY(0);pointer-events:auto}.note b{display:block;margin-bottom:5px}.note p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.note button{position:absolute;right:10px;top:8px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.controls{display:flex;justify-content:center;gap:12px;margin-top:18px;position:relative;z-index:2}
.controls button{flex:1;min-width:92px;padding:10px 18px;border-radius:999px;border:1px solid rgba(181,142,73,.28);background:#fffaf0;cursor:pointer}
.controls button:disabled{opacity:.35}
footer{display:flex;align-items:center;justify-content:center;color:#998b76;font-size:11px;letter-spacing:.12em}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(45,36,24,.17);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:.35s}
.overlay.show{opacity:1;visibility:visible}
.card{width:min(560px,88vw);padding:30px 34px;border-radius:22px;text-align:center;background:rgba(251,247,238,.97);border:1px solid rgba(181,142,73,.30);box-shadow:0 28px 80px rgba(50,40,23,.18)}
.card small{color:var(--gold);letter-spacing:.22em}.card h1{font-size:38px;font-weight:500;letter-spacing:.1em;margin:10px 0 14px}.card p{font-size:14px;line-height:1.9;color:var(--muted)}.card button{margin-top:18px;padding:11px 22px;border-radius:999px;border:1px solid rgba(181,142,73,.32);background:#fffaf0;cursor:pointer}
@media(max-width:1100px){main{grid-template-columns:190px 1fr}.scroll{display:none}}

.plain small{display:block;color:var(--gold);font-size:10px;letter-spacing:.18em;margin-bottom:5px}
.stage.speaker-left .scene-image.active,
.stage.speaker-right .scene-image.active,
.stage.speaker-child .scene-image.active{
  filter:brightness(.92)
}
.stage.speaker-left::before,
.stage.speaker-right::before,
.stage.speaker-child::before{
  content:&quot;&quot;;position:absolute;inset:0;z-index:2;pointer-events:none
}
.stage.speaker-left::before{
  background:linear-gradient(90deg,rgba(255,248,225,.10) 0 38%,rgba(28,21,12,.12) 64% 100%)
}
.stage.speaker-right::before{
  background:linear-gradient(90deg,rgba(28,21,12,.12) 0 40%,rgba(255,248,225,.10) 68% 100%)
}
.stage.speaker-child::before{
  background:linear-gradient(90deg,rgba(255,248,225,.12) 0 30%,rgba(28,21,12,.13) 58% 100%)
}
.turn-indicator{
  position:absolute;right:22px;bottom:22px;z-index:8;
  padding:7px 12px;border-radius:999px;
  background:rgba(248,241,226,.86);
  border:1px solid rgba(181,142,73,.22);
  color:var(--muted);font-size:11px
}
@media(max-width:1100px){
  main{grid-template-columns:1fr}
  .scroll{display:none}
}

.scene-glow{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 50% 42%,rgba(255,244,212,.10),transparent 55%)
}
&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;page&quot;&gt;
&lt;header&gt;&lt;div class=&quot;brand&quot;&gt;《山家清供》花馔图鉴&lt;/div&gt;&lt;div class=&quot;chapter&quot;&gt;第三章 · 读故事&lt;/div&gt;&lt;/header&gt;
&lt;main&gt;

  &lt;section class=&quot;stage&quot; id=&quot;stage&quot;&gt;
    &lt;img class=&quot;scene-image active&quot; data-scene=&quot;visit&quot; src=&quot;assets/asset-012-e07f8df498.png&quot; alt=&quot;&quot;&gt;
&lt;img class=&quot;scene-image&quot; data-scene=&quot;children&quot; src=&quot;assets/asset-013-4ecdec9ecb.png&quot; alt=&quot;&quot;&gt;
&lt;img class=&quot;scene-image&quot; data-scene=&quot;table&quot; src=&quot;assets/asset-014-3d12033339.png&quot; alt=&quot;&quot;&gt;
&lt;img class=&quot;scene-image&quot; data-scene=&quot;final&quot; src=&quot;assets/asset-015-8b5cd013dc.png&quot; alt=&quot;&quot;&gt;
    &lt;div class=&quot;dim&quot;&gt;&lt;/div&gt;&lt;div class=&quot;scene-glow&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;bubble&quot; id=&quot;bubble&quot;&gt;&lt;small id=&quot;speaker&quot;&gt;&lt;/small&gt;&lt;p id=&quot;bubbleText&quot;&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;plain&quot; id=&quot;plain&quot;&gt;&lt;small id=&quot;sceneKicker&quot;&gt;&lt;/small&gt;&lt;h2 id=&quot;sceneTitle&quot;&gt;&lt;/h2&gt;&lt;p id=&quot;plainText&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;turn-indicator&quot; id=&quot;turnIndicator&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;aside class=&quot;scroll&quot;&gt;
    &lt;h3&gt;原文卷页&lt;/h3&gt;
    &lt;div class=&quot;quote&quot; id=&quot;quote&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;button id=&quot;prev&quot;&gt;上一幕&lt;/button&gt;&lt;button id=&quot;listenStory&quot;&gt;▶ 听原文&lt;/button&gt;&lt;button id=&quot;next&quot;&gt;继续故事&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot; id=&quot;note&quot;&gt;&lt;button id=&quot;closeNote&quot;&gt;×&lt;/button&gt;&lt;b id=&quot;noteTitle&quot;&gt;&lt;/b&gt;&lt;p id=&quot;noteText&quot;&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;audio id=&quot;storyAudio&quot; preload=&quot;auto&quot;&gt;&lt;/audio&gt;
  &lt;/aside&gt;
&lt;/main&gt;
&lt;footer&gt;人物轮次 · 原文同步 · 点击注释&lt;/footer&gt;
&lt;/div&gt;

&lt;div class=&quot;overlay show&quot; id=&quot;chapterOverlay&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;small&gt;第三章&lt;/small&gt;
    &lt;h1&gt;读故事&lt;/h1&gt;
    &lt;p&gt;一枚松黄饼，从一场秋日访友说起。&lt;/p&gt;
    &lt;button id=&quot;startBtn&quot;&gt;进入故事&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const scenes=[
  {
    title:&quot;秋日访友&quot;,
    audio:&quot;assets/asset-016-c3b9850aba.mp3&quot;,
    quote:&quot;暇日，过大理寺，访秋岩陈评事介。留饮。&quot;,
    focus:&quot;visit&quot;,
    turns:[
      {type:&quot;dialogue&quot;,speaker:&quot;林洪&quot;,side:&quot;left&quot;,text:&quot;秋日清闲，特来拜访陈评事。&quot;},
      {type:&quot;dialogue&quot;,speaker:&quot;陈评事&quot;,side:&quot;right&quot;,text:&quot;山中无事，正好留下饮酒。&quot;},
      {type:&quot;narration&quot;,text:&quot;闲暇之日，林洪来到大理寺，拜访陈秋岩评事，并留下饮酒。&quot;}
    ]
  },
  {
    title:&quot;童子奉酒&quot;,
    audio:&quot;assets/asset-017-7c2cd01196.mp3&quot;,
    quote:&quot;出二童，歌渊明《归去来辞》，以松黄饼供酒。&quot;,
    focus:&quot;children&quot;,
    turns:[
      {type:&quot;dialogue&quot;,speaker:&quot;童子&quot;,side:&quot;right&quot;,text:&quot;归去来兮，请息交以绝游……&quot;},
      {type:&quot;narration&quot;,text:&quot;两位童子吟诵陶渊明《归去来辞》，并端来松黄饼佐酒。&quot;}
    ]
  },
  {
    title:&quot;超俗之姿&quot;,
    audio:&quot;assets/asset-018-e424d44939.mp3&quot;,
    quote:&quot;陈角巾美髯，有超俗之标。&quot;,
    focus:&quot;chen&quot;,
    turns:[
      {type:&quot;narration&quot;,text:&quot;陈评事头戴角巾，留着美髯，颇有超然世外的风姿。&quot;}
    ]
  },
  {
    title:&quot;山林之兴&quot;,
    audio:&quot;assets/asset-019-991eac0200.mp3&quot;,
    quote:&quot;饮边味此，使人洒然起山林之兴，觉驼峰、熊掌皆下风矣。&quot;,
    focus:&quot;table&quot;,
    turns:[
      {type:&quot;dialogue&quot;,speaker:&quot;林洪&quot;,side:&quot;left&quot;,text:&quot;此味清远，竟使珍馐也失了颜色。&quot;},
      {type:&quot;narration&quot;,text:&quot;饮酒品饼之间，林洪仿佛生出山林隐逸的清雅意趣。&quot;}
    ]
  },
  {
    title:&quot;松黄清供&quot;,
    audio:&quot;assets/asset-020-d72af6fb43.mp3&quot;,
    quote:&quot;春末，采松花黄和炼熟蜜，匀作如古龙涎饼状，不惟香味清甘，亦能壮颜益志，延永纪算。&quot;,
    focus:&quot;final&quot;,
    turns:[
      {type:&quot;narration&quot;,text:&quot;春末采松花黄，与炼熟蜂蜜调和，制成如龙涎饼一般的松黄饼。&quot;},
      {type:&quot;narration&quot;,text:&quot;松黄之珍，不在奢华，而在山林清味。&quot;}
    ]
  }
];

const notes={
  &quot;暇日&quot;:&quot;空闲的日子。&quot;,
  &quot;大理寺&quot;:&quot;古代掌管刑狱的官署。&quot;,
  &quot;评事介&quot;:&quot;评事是官职名，属大理寺；陈介，南宋人。&quot;,
  &quot;渊明&quot;:&quot;陶渊明，东晋诗人，名潜，字元亮。&quot;,
  &quot;角巾&quot;:&quot;有棱角的头巾，古代隐逸之士常用。&quot;,
  &quot;洒然&quot;:&quot;潇洒、畅快的样子。&quot;,
  &quot;驼峰、熊掌&quot;:&quot;古人认为难得而珍贵的美味。&quot;,
  &quot;龙涎&quot;:&quot;古代名贵香料，这里主要形容其形与香。&quot;
};

const stage=document.getElementById(&#x27;stage&#x27;);
const sceneImages=[...document.querySelectorAll(&#x27;.scene-image&#x27;)];
const bubble=document.getElementById(&#x27;bubble&#x27;);
const speaker=document.getElementById(&#x27;speaker&#x27;);
const bubbleText=document.getElementById(&#x27;bubbleText&#x27;);
const plain=document.getElementById(&#x27;plain&#x27;);
const sceneKicker=document.getElementById(&#x27;sceneKicker&#x27;);
const sceneTitle=document.getElementById(&#x27;sceneTitle&#x27;);
const plainText=document.getElementById(&#x27;plainText&#x27;);
const quote=document.getElementById(&#x27;quote&#x27;);
const note=document.getElementById(&#x27;note&#x27;);
const noteTitle=document.getElementById(&#x27;noteTitle&#x27;);
const noteText=document.getElementById(&#x27;noteText&#x27;);
const prev=document.getElementById(&#x27;prev&#x27;);
const next=document.getElementById(&#x27;next&#x27;);
const turnIndicator=document.getElementById(&#x27;turnIndicator&#x27;);
const chapterOverlay=document.getElementById(&#x27;chapterOverlay&#x27;);
const listenStory=document.getElementById(&#x27;listenStory&#x27;);
const storyAudio=document.getElementById(&#x27;storyAudio&#x27;);
let storyAudioScene=-1;

function notifyVoice(active){
  try{window.parent.postMessage({type:active?&#x27;voiceAudioStart&#x27;:&#x27;voiceAudioEnd&#x27;},&#x27;*&#x27;);}catch(e){}
}
function stopStoryAudio(){
  if(!storyAudio.paused) storyAudio.pause();
  storyAudio.currentTime=0;
  storyAudioScene=-1;
  listenStory.textContent=&#x27;▶ 听原文&#x27;;
  notifyVoice(false);
}
listenStory.onclick=async()=&gt;{
  const scene=scenes[current];
  if(storyAudioScene!==current){
    if(!storyAudio.paused) storyAudio.pause();
    storyAudio.src=scene.audio;
    storyAudio.currentTime=0;
    storyAudioScene=current;
  }
  if(storyAudio.paused){
    try{
      await storyAudio.play();
      listenStory.textContent=&#x27;Ⅱ 暂停朗读&#x27;;
      notifyVoice(true);
    }catch(e){}
  }else{
    storyAudio.pause();
    listenStory.textContent=&#x27;▶ 继续朗读&#x27;;
    notifyVoice(false);
  }
};
storyAudio.addEventListener(&#x27;ended&#x27;,()=&gt;{
  listenStory.textContent=&#x27;▶ 再听一遍&#x27;;
  storyAudioScene=-1;
  notifyVoice(false);
});

let current=0;
let turnIndex=0;
let renderTimer=null;
let renderToken=0;

function annotate(text){
  let result=text;
  Object.keys(notes).forEach(key=&gt;{
    result=result.replace(
      key,
      &#x27;&lt;span class=&quot;annot&quot; data-note=&quot;&#x27;+key+&#x27;&quot;&gt;&#x27;+key+&#x27;&lt;/span&gt;&#x27;
    );
  });
  return result;
}

function bindNotes(){
  document.querySelectorAll(&#x27;.annot&#x27;).forEach(el=&gt;{
    el.onclick=()=&gt;{
      const key=el.dataset.note;
      noteTitle.textContent=key;
      noteText.textContent=notes[key];
      note.classList.add(&#x27;show&#x27;);
    };
  });
}

function renderTurn(){
  const token=++renderToken;
  if(renderTimer){
    clearTimeout(renderTimer);
    renderTimer=null;
  }

  const scene=scenes[current];
  const turn=scene.turns[turnIndex];

  stage.className=&#x27;stage focus-&#x27;+scene.focus;
  const imageKey = scene.focus===&#x27;chen&#x27; ? &#x27;table&#x27; : scene.focus;
  sceneImages.forEach(img=&gt;img.classList.toggle(&#x27;active&#x27;,img.dataset.scene===imageKey));

  // 先彻底清空上一轮内容，避免旧对话在淡出过程中再次闪现。
  bubble.className=&#x27;bubble&#x27;;
  bubble.classList.remove(&#x27;show&#x27;);
  bubble.style.visibility=&#x27;hidden&#x27;;
  speaker.textContent=&#x27;&#x27;;
  bubbleText.textContent=&#x27;&#x27;;

  plain.classList.remove(&#x27;show&#x27;);
  plain.style.visibility=&#x27;hidden&#x27;;
  sceneKicker.textContent=&#x27;&#x27;;
  sceneTitle.textContent=&#x27;&#x27;;
  plainText.textContent=&#x27;&#x27;;

  note.classList.remove(&#x27;show&#x27;);

  quote.innerHTML=annotate(scene.quote);
  bindNotes();

  turnIndicator.textContent=(turnIndex+1)+&#x27; / &#x27;+scene.turns.length;
  prev.disabled=current===0 &amp;&amp; turnIndex===0;

  const lastTurn=turnIndex===scene.turns.length-1;
  const lastScene=current===scenes.length-1;
  next.textContent=lastTurn ? (lastScene?&#x27;故事读毕&#x27;:&#x27;下一幕&#x27;) : &#x27;继续&#x27;;
  next.disabled=lastTurn &amp;&amp; lastScene;

  renderTimer=setTimeout(()=&gt;{
    if(token!==renderToken) return;

    if(turn.type===&#x27;dialogue&#x27;){
      const isChild=turn.speaker===&#x27;童子&#x27;;
      stage.classList.add(isChild ? &#x27;speaker-child&#x27; : &#x27;speaker-&#x27;+turn.side);
      bubble.classList.add(isChild ? &#x27;child&#x27; : turn.side);
      speaker.textContent=turn.speaker;
      bubbleText.textContent=turn.text;
      bubble.style.visibility=&#x27;visible&#x27;;
      requestAnimationFrame(()=&gt;bubble.classList.add(&#x27;show&#x27;));
    }else{
      sceneKicker.textContent=&#x27;第&#x27;+[&#x27;一&#x27;,&#x27;二&#x27;,&#x27;三&#x27;,&#x27;四&#x27;,&#x27;五&#x27;][current]+&#x27;幕&#x27;;
      sceneTitle.textContent=scene.title;
      plainText.textContent=turn.text;
      plain.style.visibility=&#x27;visible&#x27;;
      requestAnimationFrame(()=&gt;plain.classList.add(&#x27;show&#x27;));
    }
  },160);
}

function showScene(index){
  current=Math.max(0,Math.min(scenes.length-1,index));
  turnIndex=0;
  renderTurn();
}

prev.onclick=()=&gt;{
  stopStoryAudio();
  if(turnIndex&gt;0){
    turnIndex--;
  }else if(current&gt;0){
    current--;
    turnIndex=scenes[current].turns.length-1;
  }
  renderTurn();
};

const poems={
  &#x27;su-shi&#x27;:{
    short:&#x27;山中拾黄&#x27;,author:&#x27;北宋 · 苏轼&#x27;,audio:&#x27;assets/asset-021-088c8bb0cb.mp3&#x27;,
    title:&#x27;《游罗浮道院及栖禅精舍诗》（节选）&#x27;,
    kicker:&#x27;由山林之物，入诗人之笔&#x27;,
    guide:&#x27;松黄曾被宋人采食，也曾进入诗人的生命经验。&lt;br&gt;本章重点品读与松黄直接相关的四句。&#x27;,
    lines:[&#x27;崎岖拾松黄，欲救齿发弊。&#x27;,&#x27;坐令禅客笑，一梦等千岁。&#x27;],
    keywords:[
      [&#x27;拾松黄&#x27;,&#x27;“拾松黄”点明诗人正在山中采集松花粉，松黄首先是一种可采、可食的山林物产。&#x27;],
      [&#x27;齿发弊&#x27;,&#x27;“齿发弊”指身体衰老，牙齿和头发逐渐衰败，也显出诗人对岁月流逝的感受。&#x27;],
      [&#x27;禅客笑&#x27;,&#x27;“禅客笑”让求长生的愿望带上一点自我调侃，也把诗意从服食转向生命思考。&#x27;]
    ],
    deepTitle:&#x27;从服食之愿，到生命之思&#x27;,analysisAudio:&#x27;assets/asset-022-e1c8a7090d.mp3&#x27;,
    deepBody:&#x27;在苏轼笔下，松黄不只是山林中可采可食的物产，也寄托着人对衰老、时间与生命流逝的感受。&lt;br&gt;&lt;br&gt;“欲救齿发弊”写的是想留住生命元气；“坐令禅客笑”却又让这种愿望带上一点自我调侃。于是，松黄从“可食之物”，进一步变成诗人面对岁月时的一种心绪。&#x27;,
    seal:&#x27;生命之思&#x27;,next:&#x27;继续读苏辙&#x27;
  },
  &#x27;su-zhe&#x27;:{
    short:&#x27;二月成饼&#x27;,author:&#x27;北宋 · 苏辙&#x27;,audio:&#x27;assets/asset-023-5364e5d120.mp3&#x27;,
    title:&#x27;《次韵毛君烧松花六绝·其二》&#x27;,
    kicker:&#x27;由盘中之味，入山家之诗&#x27;,
    guide:&#x27;二月采松黄，和入饼中；霜后松子落盘，又有清声可闻。&lt;br&gt;这首七言绝句将在主流程中完整呈现。&#x27;,
    lines:[&#x27;饼杂松黄二月天，&#x27;,&#x27;盘敲松子早霜寒。&#x27;,&#x27;山家一物都无弃，&#x27;,&#x27;狼藉干花最后般。&#x27;],
    keywords:[
      [&#x27;二月天&#x27;,&#x27;“二月天”点出松花开放、可以采收的时令，说明松黄属于春季山林物候。&#x27;],
      [&#x27;饼杂松黄&#x27;,&#x27;“饼杂松黄”说明松黄已经进入食物制作，不再只是可看之花，而是实实在在的食品原料。&#x27;],
      [&#x27;一物都无弃&#x27;,&#x27;“一物都无弃”写出山家珍惜物产、尽物之性的生活态度，也是全诗最重要的文化意味。&#x27;]
    ],
    deepTitle:&#x27;从时令花粉，到山家智慧&#x27;,analysisAudio:&#x27;assets/asset-024-f5967ffdc1.mp3&#x27;,
    deepBody:&#x27;在苏辙笔下，松黄从二月山林进入日常饮食，既带着季节的气息，也体现了山家依时采物、尽物之性、不轻弃自然馈赠的生活智慧。&lt;br&gt;&lt;br&gt;“饼杂松黄”写食物制作，“一物都无弃”则把盘中之味提升为一种朴素的生活观：人与自然相处，不在占有更多，而在珍惜所得。&#x27;,

function stopAnalysisAudio(reset=true){
  if(!analysisAudio.paused) analysisAudio.pause();
  if(reset) analysisAudio.currentTime=0;
  analysisAudioBtn.textContent=&#x27;▶ 听解析&#x27;;
  notifyVoice(false);
}

analysisAudioBtn.onclick=async()=&gt;{
  const p=poems[current];
  stopPoemAudio();
  if(loadedAnalysisAudio!==current){
    if(!analysisAudio.paused) analysisAudio.pause();
    analysisAudio.src=p.analysisAudio;
    analysisAudio.currentTime=0;
    loadedAnalysisAudio=current;
  }
  if(analysisAudio.paused){
    try{
      await analysisAudio.play();
      analysisAudioBtn.textContent=&#x27;Ⅱ 暂停解析&#x27;;
      notifyVoice(true);
    }catch(e){}
  }else{
    analysisAudio.pause();
    analysisAudioBtn.textContent=&#x27;▶ 继续解析&#x27;;
    notifyVoice(false);
  }
};

analysisAudio.addEventListener(&#x27;ended&#x27;,()=&gt;{
  analysisAudio.currentTime=0;
  analysisAudioBtn.textContent=&#x27;▶ 再听一遍&#x27;;
  notifyVoice(false);
});

function notifyVoice(active){
  try{window.parent.postMessage({type:active?&#x27;voiceAudioStart&#x27;:&#x27;voiceAudioEnd&#x27;},&#x27;*&#x27;);}catch(e){}
}
function stopPoemAudio(reset=true){

}

    stopPoemAudio();

  }

    try{
      await poemAudio.play();
      poemAudioBtn.textContent=&#x27;Ⅱ 暂停诵读&#x27;;
      notifyVoice(true);
    }catch(e){}
  }else{
    poemAudio.pause();
    poemAudioBtn.textContent=&#x27;▶ 继续诵读&#x27;;
    notifyVoice(false);
  }
};
poemAudio.addEventListener(&#x27;ended&#x27;,()=&gt;{
  poemAudioBtn.textContent=&#x27;▶ 再听一遍&#x27;;
  poemAudio.currentTime=0;
  notifyVoice(false);
});
const deepBtn=document.getElementById(&#x27;deepBtn&#x27;);
const keywords=document.getElementById(&#x27;keywords&#x27;);
const readerNote=document.getElementById(&#x27;readerNote&#x27;);
const progress=document.getElementById(&#x27;progress&#x27;);
let current=&#x27;su-shi&#x27;,phase=0,typing=false;
const seen=new Set();

function switchScreen(from,to){
  from.classList.add(&#x27;leave&#x27;);
  setTimeout(()=&gt;{from.classList.remove(&#x27;show&#x27;,&#x27;leave&#x27;);to.classList.add(&#x27;show&#x27;)},420);
}
function typeText(el,text,speed=70){
  return new Promise(resolve=&gt;{
    typing=true;el.textContent=&#x27;&#x27;;el.classList.add(&#x27;cursor&#x27;);let i=0;
    const timer=setInterval(()=&gt;{
      el.textContent+=text[i++]||&#x27;&#x27;;
      if(i&gt;=text.length){clearInterval(timer);el.classList.remove(&#x27;cursor&#x27;);typing=false;resolve()}
    },speed);
  });
}
function loadOpening(id){
  stopPoemAudio();
  stopAnalysisAudio();
  loadedPoemAudio=&#x27;&#x27;;
  loadedAnalysisAudio=&#x27;&#x27;;
  current=id;const p=poems[id];
  bookAuthor.textContent=p.author;bookName.textContent=p.short;
  openingKicker.textContent=p.kicker;openingTitle.textContent=p.title;
  openingAuthor.textContent=p.author;openingGuide.innerHTML=p.guide;
  fullPoemBtn.style.display=id===&#x27;su-shi&#x27;?&#x27;inline-block&#x27;:&#x27;none&#x27;;
}
function resetReader(){
  const p=poems[current];
  phase=0;typing=false;seen.clear();
  readerWrap.classList.remove(&#x27;deep&#x27;,&#x27;short-poem&#x27;,&#x27;long-poem&#x27;);
  readerWrap.classList.add(p.lines.length&gt;2?&#x27;long-poem&#x27;:&#x27;short-poem&#x27;);
  lines.forEach(el=&gt;el.textContent=&#x27;&#x27;);
  readerAuthor.textContent=p.author;readerTitle.textContent=p.title;
  keywords.innerHTML=&#x27;&#x27;;
  p.keywords.forEach(([word,note])=&gt;{
    const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;keyword&#x27;;b.textContent=word;b.dataset.note=note;
    b.onclick=()=&gt;{
      document.querySelectorAll(&#x27;.keyword&#x27;).forEach(k=&gt;k.classList.remove(&#x27;active&#x27;));
      b.classList.add(&#x27;active&#x27;);seen.add(word);readerNote.textContent=note;
      if(seen.size===p.keywords.length)deepBtn.classList.remove(&#x27;hidden&#x27;);
    };
    keywords.appendChild(b);
  });
  deepPoem.innerHTML=&#x27;&lt;div class=&quot;mini&quot;&gt;&#x27;+p.short+&#x27;&lt;/div&gt;&#x27;+p.lines.map(x=&gt;&#x27;&lt;p&gt;&#x27;+x+&#x27;&lt;/p&gt;&#x27;).join(&#x27;&#x27;);
  deepTitle.textContent=p.deepTitle;deepBody.innerHTML=p.deepBody;seal.textContent=p.seal;nextAction.textContent=p.next;
  keywords.classList.remove(&#x27;show&#x27;);readerNote.textContent=&#x27;点击“开始读诗”，诗句将缓慢出现。&#x27;;
  readBtn.textContent=&#x27;开始读诗&#x27;;readBtn.classList.remove(&#x27;hidden&#x27;);deepBtn.classList.add(&#x27;hidden&#x27;);
  progress.textContent=&#x27;01 / 04&#x27;;
}
document.querySelectorAll(&#x27;.choice&#x27;).forEach(card=&gt;{
  card.onmouseenter=()=&gt;books.className=&#x27;books &#x27;+(card.classList.contains(&#x27;left&#x27;)?&#x27;focus-left&#x27;:&#x27;focus-right&#x27;);
  card.onmouseleave=()=&gt;books.className=&#x27;books&#x27;;
  const enter=()=&gt;{loadOpening(card.dataset.poem);switchScreen(selectScreen,openingScreen)};
  card.querySelector(&#x27;.book&#x27;).onclick=enter;card.querySelector(&#x27;.choose&#x27;).onclick=enter;
});
backSelect.onclick=()=&gt;{stopPoemAudio();switchScreen(openingScreen,selectScreen)};

readBtn.onclick=async()=&gt;{

  if(phase&lt;p.lines.length){

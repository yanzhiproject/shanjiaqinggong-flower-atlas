<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>梅花 · 第三章读故事（经典画面修正版）</title>
  <style>
    :root{
      --paper:#f7f2e8;
      --paper-deep:#eee6d8;
      --ink:#3f382f;
      --muted:#8c7f70;
      --gold:#ba934e;
      --line:rgba(177,139,72,.24);
      --green:#737d58;
      --plum:#a9575d;
      --white:rgba(255,252,246,.94);
      --shadow:0 22px 56px rgba(75,59,35,.11);
      --z-base:1;
      --z-stage:10;
      --z-ui:20;
      --z-overlay:30;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
    body{font-family:"FangSong","STFangsong","Songti SC","SimSun",serif}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
    .app{height:100dvh;display:grid;grid-template-rows:76px minmax(0,1fr);background:var(--paper)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(250,247,240,.96);z-index:var(--z-ui)}
    .brand{font-family:"STKaiti","KaiTi",serif;font-size:22px;white-space:nowrap}
    .site-nav{color:var(--muted);font-size:15px;white-space:nowrap}
    .site-nav b{color:var(--plum);font-weight:400}

    .layout{min-height:0;display:grid;grid-template-columns:205px minmax(430px,1fr) 360px;gap:20px;padding:20px 24px 24px}
    .scene-nav,.story-panel{min-height:0;border:1px solid var(--line);border-radius:24px;background:rgba(255,252,246,.78);box-shadow:0 12px 32px rgba(75,59,35,.05)}
    .scene-nav{padding:20px 14px;display:flex;flex-direction:column}
    .chapter-kicker{margin:0 8px 18px;color:var(--gold);font-size:12px}
    .scene-list{display:grid;gap:10px}
    .scene-button{width:100%;border:1px solid transparent;background:transparent;border-radius:16px;padding:12px 10px;display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;cursor:pointer;transition:transform 160ms ease-out,background 160ms ease-out,border-color 160ms ease-out}
    .scene-button:hover{transform:translateY(-2px);background:rgba(186,147,78,.06);border-color:var(--line)}
    .scene-button.active{background:var(--green);color:#fff;border-color:var(--green)}
    .scene-num{width:30px;height:30px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;opacity:.72}
    .scene-copy b{display:block;font-size:15px;font-weight:500;margin:2px 0 4px}
    .scene-copy small{display:block;line-height:1.5;color:var(--muted)}
    .scene-button.active small{color:rgba(255,255,255,.72)}
    .nav-note{margin-top:auto;padding:16px 10px 4px;color:var(--muted);font-size:12px;line-height:1.7}

    .stage-wrap{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
    .stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100dvh - 124px);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#f1eadf;box-shadow:var(--shadow);isolation:isolate}
    .stage::before{content:"";position:absolute;inset:0;background-color:#f4ede1;background-image:radial-gradient(rgba(80,68,52,.07) .7px,transparent .7px);background-size:7px 7px;z-index:var(--z-base)}
    .paper-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:var(--z-stage);filter:saturate(.96);pointer-events:none}
    .paper-piece.p1{clip-path:polygon(0 0,62% 0,55% 36%,0 43%);transform:translateY(-24px) rotate(-.5deg)}
    .paper-piece.p2{clip-path:polygon(0 31%,38% 24%,45% 100%,0 100%);transform:translateX(-28px) rotate(.6deg)}
    .paper-piece.p3{clip-path:polygon(30% 18%,70% 12%,75% 100%,40% 100%);transform:translateY(26px) scale(.985)}
    .paper-piece.p4{clip-path:polygon(62% 0,100% 0,100% 65%,69% 76%);transform:translateX(28px) rotate(-.5deg)}
    .paper-piece.p5{clip-path:polygon(65% 58%,100% 50%,100% 100%,67% 100%);transform:translateY(24px) rotate(.45deg)}
    .stage.assemble .paper-piece{animation:press-in 260ms ease-out forwards}
    .stage.assemble .p1{animation-delay:0ms}
    .stage.assemble .p2{animation-delay:80ms}
    .stage.assemble .p3{animation-delay:160ms}
    .stage.assemble .p4{animation-delay:240ms}
    .stage.assemble .p5{animation-delay:320ms}
    @keyframes press-in{0%{opacity:0}72%{opacity:1;transform:translate3d(0,-2px,0) scale(1.006)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    .scene-seal{position:absolute;left:22px;top:20px;z-index:var(--z-ui);padding:9px 15px;border:1px solid rgba(186,147,78,.3);border-radius:999px;background:rgba(255,252,246,.9);color:var(--gold);font-size:13px;opacity:0;transform:translateY(10px)}
    .stage.assemble .scene-seal{animation:soft-enter 260ms 520ms ease-out forwards}
    @keyframes soft-enter{to{opacity:1;transform:translateY(0)}}
    .hotspots{position:absolute;inset:0;z-index:var(--z-ui);pointer-events:none}
    .hotspot{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border:1px solid rgba(255,255,255,.88);border-radius:50%;background:rgba(255,252,246,.18);box-shadow:0 0 0 6px rgba(255,252,246,.12);cursor:pointer;opacity:0;transform:scale(.82);pointer-events:none;transition:transform 160ms ease-out,background 160ms ease-out}
    .stage.ready .hotspot{opacity:1;transform:scale(1);pointer-events:auto;animation:hotspot-in 320ms ease-out both}
    .stage.ready .hotspot:nth-child(2){animation-delay:80ms}.stage.ready .hotspot:nth-child(3){animation-delay:160ms}.stage.ready .hotspot:nth-child(4){animation-delay:240ms}
    @keyframes hotspot-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .hotspot:hover,.hotspot.visited{background:rgba(169,87,93,.62);transform:scale(1.08)}
    .hotspot::after{content:attr(aria-label);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:rgba(49,42,34,.78);color:#fff;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 160ms ease-out}
    .hotspot:hover::after,.hotspot:focus-visible::after{opacity:1}
    .fact-card{position:absolute;left:22px;right:22px;bottom:20px;z-index:var(--z-ui);padding:15px 48px 15px 18px;border:1px solid var(--line);border-radius:17px;background:rgba(255,252,246,.96);box-shadow:0 12px 30px rgba(60,47,30,.13);opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity 200ms ease-out,transform 200ms ease-out}
    .fact-card.show{opacity:1;transform:translateY(0);pointer-events:auto}
    .fact-card b{display:block;color:var(--plum);font-weight:500;margin-bottom:5px}.fact-card p{margin:0;font-size:14px;line-height:1.7;color:#6f6254}
    .fact-close{position:absolute;right:12px;top:11px;width:32px;height:32px;border:0;background:transparent;border-radius:50%;cursor:pointer;font-size:20px;color:var(--muted)}
    .replay-motion{position:absolute;right:18px;bottom:18px;z-index:var(--z-ui);border:1px solid var(--line);border-radius:999px;background:rgba(255,252,246,.9);padding:8px 13px;cursor:pointer;color:var(--muted);opacity:0;transition:opacity 160ms ease-out,transform 160ms ease-out}
    .stage.ready .replay-motion{opacity:1}.replay-motion:hover{transform:translateY(-2px)}

    .story-panel{padding:24px 24px 20px;display:flex;flex-direction:column;overflow:auto}
    .story-eyebrow{color:var(--gold);font-size:12px;margin-bottom:12px}
    .story-panel h1{font-family:"STKaiti","KaiTi",serif;font-size:42px;line-height:1.08;font-weight:400;margin:0 0 12px;text-wrap:balance}
    .story-lead{margin:0;color:var(--muted);font-size:15px;line-height:1.85;text-wrap:pretty}
    .divider{height:1px;background:var(--line);margin:20px 0}
    .story-body{font-size:16px;line-height:1.95;margin:0;text-wrap:pretty}
    .source-note{margin-top:18px;padding:13px 14px;border-left:3px solid var(--gold);background:rgba(186,147,78,.06);color:var(--muted);font-size:12px;line-height:1.7}
    .food-grid{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
    .food-grid.show{display:grid}
    .food-chip{border:1px solid var(--line);border-radius:13px;background:#fffaf1;padding:9px 10px;text-align:center;color:#6f6254;font-size:13px}
    .controls{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:auto;padding-top:22px}
    .control{border:1px solid var(--line);border-radius:999px;background:#fffaf1;padding:12px 14px;cursor:pointer;transition:transform 160ms ease-out,background 160ms ease-out}
    .control:hover:not(:disabled){transform:translateY(-2px);background:#fffdf8}
    .control.primary{background:var(--green);border-color:var(--green);color:#fff;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
    .control.primary:hover:not(:disabled),.control.primary:active:not(:disabled),.control.primary:focus:not(:disabled),.control.primary:focus-visible:not(:disabled){background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;box-shadow:none}
    .control.primary:focus-visible{outline:2px solid rgba(186,147,78,.72);outline-offset:3px}
    .control:disabled{opacity:.38;cursor:not-allowed}

    .overlay{position:fixed;inset:0;z-index:var(--z-overlay);display:grid;place-items:center;padding:24px;background:rgba(239,232,220,.88);opacity:0;visibility:hidden;transition:opacity 200ms ease-out,visibility 200ms ease-out}
    .overlay.show{opacity:1;visibility:visible}
    .intro-card,.complete-card{width:min(590px,92vw);padding:38px 42px;border:1px solid var(--line);border-radius:26px;background:rgba(255,252,246,.98);box-shadow:0 30px 80px rgba(70,54,34,.16);text-align:center}
    .intro-seal{width:52px;height:52px;margin:0 auto 17px;border:1px solid var(--plum);display:grid;place-items:center;color:var(--plum);font-family:"STKaiti","KaiTi",serif;font-size:24px;transform:rotate(-2deg)}
    .intro-card small,.complete-card small{color:var(--gold)}
    .intro-card h2,.complete-card h2{font-family:"STKaiti","KaiTi",serif;font-size:44px;font-weight:400;margin:10px 0 13px;text-wrap:balance}
    .intro-card p,.complete-card p{margin:0;color:var(--muted);line-height:1.9}
    .intro-card button,.complete-card button{margin-top:24px;border:1px solid var(--line);border-radius:999px;background:#fffaf1;padding:12px 24px;cursor:pointer}
    .complete-actions{display:flex;justify-content:center;gap:10px}.complete-actions .primary{background:var(--green);color:#fff;border-color:var(--green)}

    @media(max-width:1180px){
      .layout{grid-template-columns:170px minmax(390px,1fr) 310px;gap:14px;padding:14px}
      .story-panel{padding:20px}.story-panel h1{font-size:35px}.scene-copy small{display:none}
    }
    @media(max-width:900px){
      html,body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-rows:66px auto}.topbar{padding:0 16px}.site-nav{display:none}
      .layout{display:flex;flex-direction:column;padding:12px}.scene-nav{order:1}.stage-wrap{order:2}.story-panel{order:3;min-height:430px}
      .scene-list{grid-template-columns:repeat(4,1fr)}.scene-button{display:block;text-align:center;padding:10px 5px}.scene-num{margin:auto}.scene-copy small{display:none}.nav-note{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}
      .paper-piece,.scene-seal,.hotspot{opacity:1!important;transform:none!important}
    }
  
  @font-face{
    font-family:"ShanjiaTitle";
    src:url("../../assets/ui/sjq-wenyue-guti-fangsong.woff2") format("woff2");
    font-style:normal;font-weight:400;font-display:swap;
  }
  :root{
    --paper:#f7f1e7;--paper-deep:#f0e8da;--ink:#3e382f;--muted:#8a7e6d;
    --gold:#c49c50;--line:rgba(196,156,80,.20);--green:#6f7657;--plum:#a44b3e;
  }
  body{font-family:"Noto Serif SC","Songti SC","SimSun",serif;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.64),rgba(255,255,255,.18) 56%,transparent 82%),linear-gradient(180deg,#f8f1e5,#f4eadb)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .app{grid-template-rows:62px minmax(0,1fr);background:transparent}
  .topbar{height:62px;padding:0 34px;border-bottom:1px solid rgba(196,156,80,.16);background:rgba(250,247,240,.86)}
  .brand{font-family:"ShanjiaTitle","Songti SC",serif;font-size:18px;letter-spacing:.08em}
  .site-nav{font-size:12px;letter-spacing:.13em}
  .layout{grid-template-columns:190px minmax(430px,1fr) 330px;gap:18px;padding:18px 28px 22px}
  .scene-nav,.story-panel{border-radius:22px;background:rgba(251,247,238,.97);border-color:rgba(196,156,80,.22);box-shadow:0 18px 54px rgba(61,46,30,.08)}
  .stage{border-radius:22px;border-color:rgba(196,156,80,.25);box-shadow:0 22px 62px rgba(61,46,30,.10);max-height:calc(100dvh - 108px)}
  .story-panel h1,.intro-card h2,.complete-card h2,.intro-seal{font-family:"ShanjiaTitle","Songti SC",serif}
  .story-panel h1{letter-spacing:.06em}
  .story-panel h1:focus{outline:none}
  .source-note{display:none!important}
  .control,.intro-card button,.complete-card button,.replay-motion{background:#fffaf0;border-color:rgba(197,161,90,.30)}
  .control.primary,.complete-actions .primary{background:var(--green);border-color:var(--green);color:#fff}
  .scene-button.active{background:var(--green);border-color:var(--green)}

  /* Five overlapping irregular paper strips cover the complete image.
     The overlaps remove the former triangular uncovered area. */
  .paper-piece.p1{clip-path:polygon(0 0,24% 0,28% 100%,0 100%)}
  .paper-piece.p2{clip-path:polygon(22% 0,47% 0,51% 100%,26% 100%)}
  .paper-piece.p3{clip-path:polygon(45% 0,70% 0,74% 100%,49% 100%)}
  .paper-piece.p4{clip-path:polygon(68% 0,87% 0,91% 100%,72% 100%)}
  .paper-piece.p5{clip-path:polygon(85% 0,100% 0,100% 100%,89% 100%)}
  @media(max-width:1180px){.layout{grid-template-columns:170px minmax(390px,1fr) 310px;gap:14px;padding:14px}}
  @media(max-width:900px){.app{grid-template-rows:56px auto}.topbar{height:56px;padding:0 18px}.layout{display:flex;padding:12px}}

  /* Embedded chapter: the parent page supplies the only global header. */
  .topbar{display:none!important}
  .app{grid-template-rows:minmax(0,1fr)!important}
  .layout{padding:16px 24px 18px!important;grid-template-columns:185px minmax(420px,1fr) 340px!important}
  .nav-note{display:none!important}
  .story-panel{overflow:hidden!important;padding:22px 23px 18px!important}
  .story-panel h1{font-size:36px!important;line-height:1.14!important}
  .story-lead{font-size:15px!important;line-height:1.75!important}
  .story-body{font-size:16px!important;line-height:1.82!important}
  .divider{margin:15px 0!important}
  .controls{padding-top:14px!important;gap:9px!important}
  .control{min-height:44px!important;padding:10px 12px!important;white-space:nowrap!important}
  .stage{max-height:calc(100dvh - 34px)!important}
  @media(max-height:690px) and (min-width:901px){
    .layout{padding:12px 20px 14px!important;grid-template-columns:175px minmax(400px,1fr) 330px!important}
    .scene-nav{padding:15px 12px!important}.chapter-kicker{margin-bottom:10px!important}.scene-list{gap:6px!important}
    .scene-button{padding:8px!important}.story-panel{padding:16px 20px 14px!important}
    .story-panel h1{font-size:31px!important;margin-bottom:8px!important}.story-lead{font-size:14px!important;line-height:1.6!important}
    .story-body{font-size:15px!important;line-height:1.68!important}.divider{margin:11px 0!important}.controls{padding-top:10px!important}
  }

</style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">《山家清供》 花馔图鉴</div>
      <div class="site-nav">识名物 · 看菜谱 · <b>读故事</b> · 赏诗词 · 品意蕴</div>
    </header>
    <main class="layout">
      <nav class="scene-nav" aria-label="故事幕次">
        <div class="chapter-kicker">第三章 · 读故事</div>
        <div class="scene-list" id="sceneList"></div>
        <p class="nav-note">点击幕次可自由返回。进入每一幕时，纸片会自动依次组装；画面稳定后可点击圆形线索。</p>
      </nav>

      <section class="stage-wrap" aria-label="纸片拼贴故事舞台">
        <div class="stage" id="stage">
          <img class="paper-piece p1" alt="">
          <img class="paper-piece p2" alt="">
          <img class="paper-piece p3" alt="">
          <img class="paper-piece p4" alt="">
          <img class="paper-piece p5" alt="">
          <div class="scene-seal" id="sceneSeal"></div>
          <div class="hotspots" id="hotspots"></div>
          <div class="fact-card" id="factCard" role="status" aria-live="polite">
            <b id="factTitle"></b><p id="factText"></p>
            <button class="fact-close" id="factClose" aria-label="关闭线索说明">×</button>
          </div>
          <button class="replay-motion" id="replayMotion">重看纸戏</button>
        </div>
      </section>

      <aside class="story-panel" aria-live="polite">
        <div class="story-eyebrow" id="storyEyebrow"></div>
        <h1 id="storyTitle" tabindex="-1"></h1>
        <p class="story-lead" id="storyLead"></p>
        <div class="divider"></div>
        <p class="story-body" id="storyBody"></p>
        <div class="food-grid" id="foodGrid">
          <div class="food-chip">蜜渍梅花</div><div class="food-chip">梅花汤饼</div>
          <div class="food-chip">梅粥</div><div class="food-chip">汤绽梅</div>
        </div>
        <div class="source-note" id="sourceNote"></div>
        <div class="controls">
          <button class="control" id="prevScene">返回上一幕</button>
          <button class="control primary" id="nextScene">继续故事</button>
        </div>
      </aside>
    </main>
  </div>

  <section class="overlay show" id="introOverlay" role="dialog" aria-modal="true" aria-labelledby="introTitle" aria-hidden="false">
    <div class="intro-card">
      <div class="intro-seal">梅</div>
      <small>第三章 · 读故事</small>
      <h2 id="introTitle">一脉梅香</h2>
      <p>这里不再重复汤绽梅的制法。请走进孤山与书斋，看看梅花如何从林逋的知己，成为林洪笔下的山家清供。</p>
      <button id="startStory">进入纸片故事</button>
    </div>
  </section>

  <section class="overlay" id="completeOverlay" role="dialog" aria-modal="true" aria-labelledby="completeTitle" aria-hidden="true">
    <div class="complete-card">
      <small>第三章 · 读故事完成</small>
      <h2 id="completeTitle">从孤山，到清供</h2>
      <p>林逋把梅花视作知己，林洪则让梅香进入山居日常。亲缘尚待考辨，一脉爱梅的文化想象却在书页间延续。</p>
      <div class="complete-actions">
        <button id="readAgain">再读一遍</button>
        <button class="primary" id="poetryNext">下一章 · 赏诗词</button>
      </div>
    </div>
  </section>

  <script>
    const sceneImages = ["assets/asset-003-bdcc47883d.webp","assets/asset-004-cacc30c30c.webp","assets/asset-005-28eaa5caab.webp","assets/asset-006-1072a18544.webp"];
    const scenes = [
      {
        nav:"孤山种梅人", seal:"第一幕 · 孤山", title:"孤山种梅人",
        lead:"一位远离仕途、以梅为伴的隐士。",
        body:"北宋时，林逋长期隐居杭州孤山。他不求仕进，以读书、作诗和山居生活自处。梅花后来成为这段隐逸人生最鲜明的象征。",
        note:"故事依据通行人物资料整理；人物为艺术化纸偶，并非林逋的真实历史肖像。",
        points:[
          {x:19,y:20,label:"梅枝",title:"种梅",text:"梅花不只是孤山风景，也逐渐成为后人理解林逋人格与生活选择的象征。"},
          {x:14,y:44,label:"草庐",title:"隐居",text:"林逋长期居于孤山，将读书、作诗与山水生活置于功名之外。"},
          {x:53,y:72,label:"白鹤",title:"养鹤",text:"林逋养鹤的故事与种梅的形象相互交织，后来凝结成“梅妻鹤子”的说法。"}
        ]
      },
      {
        nav:"梅妻鹤子", seal:"第二幕 · 相伴", title:"梅妻鹤子",
        lead:"不是一段婚姻，而是一种关于陪伴的文化想象。",
        body:"后人用“梅妻鹤子”形容林逋：以梅为妻，以鹤为子。它并非在讲真实家庭关系，而是借梅与鹤，表现他远离尘俗、以自然为伴的隐逸形象。",
        note:"“梅妻鹤子”是后世广泛流传的人物形象概括，页面采用情境演绎呈现。",
        points:[
          {x:18,y:21,label:"梅花",title:"梅妻",text:"“妻”不是事实称谓，而是以亲密关系比喻林逋对梅花的珍爱。"},
          {x:43,y:52,label:"林逋",title:"山中之人",text:"人物位于梅与鹤之间，画面强调的是人与自然相伴，而非热闹的世俗生活。"},
          {x:53,y:66,label:"白鹤",title:"鹤子",text:"白鹤与梅花共同构成林逋最为人熟知的文化形象。"}
        ]
      },
      {
        nav:"一脉梅香", seal:"第三幕 · 线索", title:"一脉梅香",
        lead:"一条动人的联系，也是一条需要谨慎说明的线索。",
        body:"林洪自称林逋七世孙。现有材料尚不足以把这层亲缘当作完全确定的事实，但从孤山种梅到《山家清供》写梅，两人的文化形象确实因梅花产生了耐人寻味的呼应。",
        note:"严谨表述应当使用“林洪自称”或“传统说法”，不把亲缘关系写成已经确证的历史事实。",
        points:[
          {x:21,y:56,label:"林逋",title:"北宋 · 林逋",text:"孤山、梅花与白鹤，构成后世熟悉的隐士形象。"},
          {x:51,y:44,label:"断续梅枝",title:"尚待考辨",text:"梅枝被处理为断续的纸片，表示文化联系可以讲述，血缘关系仍须保留史实边界。"},
          {x:83,y:58,label:"林洪",title:"南宋 · 林洪",text:"林洪在《山家清供》中记录多种梅花食物，使梅花从观赏进入山居饮食。"}
        ]
      },
      {
        nav:"梅入清供", seal:"第四幕 · 入馔", title:"梅入清供",
        lead:"当梅花从枝头落到书页，也进入了宋人的日常。",
        body:"《山家清供》里不只有汤绽梅，还记录了蜜渍梅花、梅花汤饼和梅粥。林洪笔下的梅花既可赏、可闻，也可饮、可食。梅不再只是远处的风景，而成为可以珍藏的生活滋味。",
        note:"本幕依据《山家清供》相关条目整理，四种食签用于展示梅花入馔的范围，不再重复第二章的制作步骤。",
        points:[
          {x:49,y:44,label:"古书",title:"写入清供",text:"空白书页代表即将被记录的山居滋味；梅枝从书中生长，表现梅花进入文字与日常。"},
          {x:21,y:75,label:"蜜缶",title:"藏梅",text:"蜂蜜、花瓣与封藏，让短暂的花期被保存下来。"},
          {x:70,y:72,label:"梅馔",title:"食梅",text:"粥、饼与花饮共同说明：宋人对梅花的欣赏，可以延伸到味觉之中。"}
        ]
      }
    ];

    const ui={
      stage:document.getElementById("stage"),sceneList:document.getElementById("sceneList"),sceneSeal:document.getElementById("sceneSeal"),
      hotspots:document.getElementById("hotspots"),factCard:document.getElementById("factCard"),factTitle:document.getElementById("factTitle"),factText:document.getElementById("factText"),factClose:document.getElementById("factClose"),
      storyEyebrow:document.getElementById("storyEyebrow"),storyTitle:document.getElementById("storyTitle"),storyLead:document.getElementById("storyLead"),storyBody:document.getElementById("storyBody"),sourceNote:document.getElementById("sourceNote"),foodGrid:document.getElementById("foodGrid"),
      prev:document.getElementById("prevScene"),next:document.getElementById("nextScene"),replay:document.getElementById("replayMotion"),
      intro:document.getElementById("introOverlay"),start:document.getElementById("startStory"),complete:document.getElementById("completeOverlay"),readAgain:document.getElementById("readAgain"),poetryNext:document.getElementById("poetryNext")
    };
    let sceneIndex=0,readyTimer=null,lastHotspot=null;

    scenes.forEach((scene,index)=>{
      const button=document.createElement("button");
      button.className="scene-button";
      button.innerHTML=`<span class="scene-num">${index+1}</span><span class="scene-copy"><b>${scene.nav}</b><small>${["访孤山","识梅鹤","辨世系","见清供"][index]}</small></span>`;
      button.addEventListener("click",()=>showScene(index));
      ui.sceneList.appendChild(button);
    });

    function closeFact(restoreFocus=false){
      ui.factCard.classList.remove("show");
      if(restoreFocus&&lastHotspot)lastHotspot.focus();
    }
    function assembleScene(){
      clearTimeout(readyTimer);closeFact();ui.stage.classList.remove("assemble","ready");
      void ui.stage.offsetWidth;ui.stage.classList.add("assemble");
      readyTimer=setTimeout(()=>ui.stage.classList.add("ready"),720);
    }
    function showScene(index){
      sceneIndex=Math.max(0,Math.min(scenes.length-1,index));
      const scene=scenes[sceneIndex];
      [...ui.sceneList.children].forEach((b,i)=>b.classList.toggle("active",i===sceneIndex));
      ui.stage.querySelectorAll(".paper-piece").forEach(piece=>piece.src=sceneImages[sceneIndex]);
      ui.sceneSeal.textContent=scene.seal;
      ui.storyEyebrow.textContent=`第三章 · 第 ${sceneIndex+1} 幕`;
      ui.storyTitle.textContent=scene.title;ui.storyLead.textContent=scene.lead;ui.storyBody.textContent=scene.body;ui.sourceNote.textContent=scene.note;
      ui.foodGrid.classList.toggle("show",sceneIndex===3);
      ui.prev.disabled=sceneIndex===0;ui.next.textContent=sceneIndex===scenes.length-1?"合上故事卷":"继续故事";
      ui.hotspots.innerHTML="";
      scene.points.forEach(point=>{
        const btn=document.createElement("button");btn.className="hotspot";btn.type="button";btn.setAttribute("aria-label",point.label);btn.style.left=point.x+"%";btn.style.top=point.y+"%";
        btn.addEventListener("click",()=>{lastHotspot=btn;ui.factTitle.textContent=point.title;ui.factText.textContent=point.text;ui.factCard.classList.add("show");btn.classList.add("visited");ui.factClose.focus()});
        ui.hotspots.appendChild(btn);
      });
      assembleScene();
    }

    ui.start.addEventListener("click",()=>{ui.intro.classList.remove("show");ui.intro.setAttribute("aria-hidden","true");showScene(0);ui.storyTitle.focus({preventScroll:true})});
    ui.prev.addEventListener("click",()=>showScene(sceneIndex-1));
    ui.next.addEventListener("click",()=>{if(sceneIndex<scenes.length-1)showScene(sceneIndex+1);else{ui.complete.classList.add("show");ui.complete.setAttribute("aria-hidden","false");ui.readAgain.focus()}});
    ui.replay.addEventListener("click",assembleScene);ui.factClose.addEventListener("click",()=>closeFact(true));
    ui.readAgain.addEventListener("click",()=>{ui.complete.classList.remove("show");ui.complete.setAttribute("aria-hidden","true");showScene(0);ui.storyTitle.focus({preventScroll:true})});
    ui.poetryNext.addEventListener("click",()=>parent.postMessage({type:"meihua-enter-poetry"},"*"));
    document.addEventListener("keydown",event=>{
      const dialog=ui.intro.classList.contains("show")?ui.intro:(ui.complete.classList.contains("show")?ui.complete:null);
      if(dialog){
        if(event.key==="Tab"){
          const focusable=[...dialog.querySelectorAll("button:not([disabled])")];
          const first=focusable[0],last=focusable[focusable.length-1];
          if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
          else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
        }
        return;
      }
      if(event.key==="ArrowLeft"&&sceneIndex>0)showScene(sceneIndex-1);
      if(event.key==="ArrowRight"&&sceneIndex<scenes.length-1)showScene(sceneIndex+1);
      if(event.key==="Escape")closeFact(true);
    });
    showScene(0);setTimeout(()=>ui.start.focus(),0);
  </script>
<script>
  window.addEventListener('message',event=>{
    if(event.data?.type!=='meihua-prev-step')return;
    if(ui.complete.classList.contains('show')){ui.complete.classList.remove('show');ui.complete.setAttribute('aria-hidden','true');return}
    if(!ui.intro.classList.contains('show')&&sceneIndex>0){showScene(sceneIndex-1);return}
    if(!ui.intro.classList.contains('show')){ui.intro.classList.add('show');ui.intro.setAttribute('aria-hidden','false');return}
    parent.postMessage({type:'meihua-request-back-chapter'},'*');
  });
  </script></body>
</html>

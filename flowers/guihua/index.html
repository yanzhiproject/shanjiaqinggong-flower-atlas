<script>
const guessStage = document.getElementById('guessStage');
const learnStage = document.getElementById('learnStage');
const statusText = document.getElementById('statusText');
const modal = document.getElementById('guessModal');
const feedback = document.getElementById('feedback');
let selectedAnswer = null;

document.getElementById('guessBtn').addEventListener('click', ()=>{ modal.classList.add('show'); feedback.textContent=''; });

  modal.classList.remove('show');
  guessStage.classList.remove('show');

});

const cards = {
  flower: {
    title:'桂花 · 看花',
    lead:'花虽小，却常成簇开放。',
    body:'桂花的花很小，多为四瓣，常成簇开放在叶腋之间。',
    chipA:'小而成簇', chipB:'叶腋之间',
    caption:'看花 · 小而成簇', count:'01 / 03',
    img:'assets/asset-002-4e95634649.png', alt:'桂花花部图'
  },
  leaf: {
    title:'桂花 · 看叶',
    lead:'叶片常绿，椭圆而有光泽。',
    body:'叶片多为椭圆形，质地较厚，叶缘有细小锯齿。',
    chipA:'椭圆厚实', chipB:'细小锯齿',
    caption:'看叶 · 厚实有光泽', count:'02 / 03',
    img:'assets/asset-003-74dc146e07.png', alt:'桂花叶部图'
  },
  scent: {
    title:'桂花 · 闻香',
    lead:'花虽小，香气却十分明显。',
    body:'桂花的香清甜而浓郁，常让人先闻其香，再见其花。',
    chipA:'清甜浓郁', chipB:'先闻后见',
    caption:'闻香 · 清甜而浓郁', count:'03 / 03',
    img:'assets/asset-004-493b4d7963.png', alt:'桂花香气图'
  }
};

function renderCard(key) {
  const c = cards[key];
  document.getElementById('learnTitle').textContent = c.title;
  document.getElementById('learnLead').textContent = c.lead;
  document.getElementById('learnBody').textContent = c.body;
  document.getElementById('chipA').textContent = c.chipA;
  document.getElementById('chipB').textContent = c.chipB;
  document.getElementById('captionTag').textContent = c.caption;
  document.getElementById('learnCount').textContent = c.count;
  const img = document.getElementById('learnImage');
  img.src = c.img;
  img.alt = c.alt;
  document.querySelectorAll('.learn-tabs button').forEach(btn => btn.classList.toggle('active', btn.dataset.key === key));
}
document.querySelectorAll('.learn-tabs button').forEach(btn => btn.addEventListener('click', ()=>renderCard(btn.dataset.key)));
document.getElementById('resetBtn').addEventListener('click', ()=> window.location.reload());

document.getElementById('musicBtn').addEventListener('click', ()=>{});

// ===== p5 桂花树：放大后的沉浸式观察 =====
let tree;
let windAngle = 0;
let minX, maxX, minY, maxY;
let lastSeed;
let leaveImage;
let flowerImage;
let fallingFlowers = [];
let terminalBranches = [];

function setup() {
  const host = document.getElementById('p5-host');
  const rect = host.getBoundingClientRect();
  const c = createCanvas(rect.width, rect.height, P2D);
  c.parent('p5-host');
  clear();
  leaveImage = createLeaveImage();
  flowerImage = createFlowerImage();
  createNewTree("Osmanthus");
}

function createLeaveImage() {
  let buffer = createGraphics(22, 30);
  buffer.clear();
  buffer.stroke(40, 70, 55, 180);
  buffer.strokeWeight(1.2);
  buffer.line(11, 3, 11, 27);
  buffer.noStroke();
  buffer.fill(85, 125, 105, 210);
  buffer.ellipse(11, 15, 15, 24);
  buffer.fill(120, 160, 135, 160);
  buffer.ellipse(11, 15, 10, 17);
  return buffer;
}

function createFlowerImage() {
  let buffer = createGraphics(16, 16);
  buffer.clear();
  buffer.noStroke();
  buffer.fill(255, 210, 50, 220);
  for (let i = 0; i < 4; i++) {
    buffer.push();
    buffer.translate(8, 8);
    buffer.rotate(HALF_PI * i);
    buffer.ellipse(0, -4.8, 5, 8);
    buffer.pop();
  }
  buffer.fill(210, 140, 20, 200);
  buffer.ellipse(8, 8, 3.5, 3.5);
  return buffer;
}

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
  return hash;
}

function createNewTree(seed) {
  lastSeed = seed;
  randomSeed(hashString(seed));
  minX = width / 2; maxX = width / 2; minY = height; maxY = height;
  terminalBranches = [];
  tree = new Branch(null, width / 2, height * 0.9, PI, min(width, height) * 0.19);
  let xSize = maxX - minX;
  let ySize = maxY - minY;
  let targetW = width * 0.86;
  let targetH = height * 0.84;
  let treeScaleVal = min(targetW / max(1, xSize), targetH / max(1, ySize));
  tree.setTreeScale(treeScaleVal);
  tree.x = width * 0.48 - xSize / 2 * treeScaleVal + (tree.x - minX) * treeScaleVal;
  tree.y = height * 0.77 + ySize / 2 * treeScaleVal + (tree.y - maxY) * treeScaleVal;
  fallingFlowers = [];
}

function windowResized() {
  const host = document.getElementById('p5-host');
  resizeCanvas(host.clientWidth, host.clientHeight);
  createNewTree(lastSeed || "Osmanthus");
}

function draw() {
  clear();
  windAngle += 0.003;
  tree.windForce = sin(windAngle) * 0.012;
  tree.update();
  tree.render();
  for (let i = fallingFlowers.length - 1; i >= 0; i--) {
    let f = fallingFlowers[i];
    f.update();
    f.render();
    if (f.offScreen()) fallingFlowers.splice(i, 1);
  }
}

function mouseClicked() {
  if (!guessStage.classList.contains('show')) return;
  if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
    for (let i = 0; i < 8; i++) {
      if (terminalBranches.length > 0) {
        let node = random(terminalBranches);
        fallingFlowers.push(
          new FallingFlower(
            node.x + random(-10, 10),
            node.y + random(2, 16)
          )
        );
      }
    }
  }
}

class FallingFlower {
  constructor(x, y) {
    this.x = x; this.y = y; this.vy = random(1.1, 2.2); this.vx = random(-0.9, 0.9);
    this.angle = random(TWO_PI); this.spin = random(-0.05, 0.05); this.alpha = 240;
  }
  update() {
    this.y += this.vy;
    this.x += this.vx + sin(frameCount * 0.05) * 0.4;
    this.angle += this.spin;

<script>
const state={phase:'original',step:-1,completed:[false,false,false,false,false],s2:{knife:false,water:false},s3:0,s4:0,s5:{fire:false,lid:false}};
const scenes=[...document.querySelectorAll('.scene')], steps=[...document.querySelectorAll('.step')], progress=[...document.querySelectorAll('#progress i')];
const title=document.getElementById('title'), lead=document.getElementById('lead'), quote=document.getElementById('quote'), status=document.getElementById('taskStatus'), culture=document.getElementById('culture'), nextBtn=document.getElementById('nextBtn'), prevBtn=document.getElementById('prevBtn');
const toast=document.getElementById('toast');let toastTimer;
const basket=document.getElementById('basket'), step1Feedback=document.getElementById('step1Feedback');
const stemPile=document.getElementById('stemPile'), waterSheen=document.getElementById('waterSheen');
const step2Dry=document.getElementById('step2Dry'), step2Wet=document.getElementById('step2Wet');
const grindRing=document.getElementById('grindRing'), mortarCounter=document.getElementById('mortarCounter');
const mortarFill1=document.getElementById('mortarFill1'), mortarFill2=document.getElementById('mortarFill2'), mortarFill3=document.getElementById('mortarFill3');
const moldReveal=document.getElementById('moldReveal'), steamReveal=document.getElementById('steamReveal');
const moldStateNote=document.getElementById('moldStateNote'), steamStateNote=document.getElementById('steamStateNote');
const finalPlateSrc=document.querySelector('[data-scene="complete"] .final-plate').src;
const moldedCakeSrc='assets/asset-016-ed9602574a.webp';
const steamerOpenSrc='assets/asset-017-fbf66f8173.webp';
const squareMoldSrc='assets/asset-018-76744cf3ad.webp';
const step2DrySrc='assets/asset-019-63fad1195f.webp';
const step2WetSrc='assets/asset-020-c27eee2f0e.webp';
const mortarFill1Src='assets/asset-021-a319df2d6c.webp';
const mortarFill2Src='assets/asset-022-4ec4d76d71.webp';
const mortarFill3Src='assets/asset-023-6cdf3856c1.webp';
document.getElementById('mold').src=squareMoldSrc;
step2Dry.src=step2DrySrc; step2Wet.src=step2WetSrc;
mortarFill1.src=mortarFill1Src; mortarFill2.src=mortarFill2Src; mortarFill3.src=mortarFill3Src;
moldReveal.src=moldedCakeSrc; steamReveal.src=steamerOpenSrc;
function syncVisuals(){
  basket.classList.toggle('filled', state.completed[0]);
  step1Feedback.classList.toggle('show', state.completed[0]);
  stemPile.classList.toggle('on', state.s2.knife);
  waterSheen.classList.toggle('on', state.s2.water);
  step2Dry.classList.toggle('show', state.s2.knife && !state.s2.water);
  step2Wet.classList.toggle('show', state.s2.water);
  knife.textContent=state.s2.knife?'✓':'✦'; water.textContent=state.s2.water?'✓':'✦';
  knife.classList.toggle('done', state.s2.knife); water.classList.toggle('done', state.s2.water);
  mortarCounter.textContent='舂粉 '+state.s3+' / 3';
  mortarFill1.classList.toggle('show', state.s3===1);
  mortarFill2.classList.toggle('show', state.s3===2);
  mortarFill3.classList.toggle('show', state.s3>=3);
  mold.classList.toggle('mold-pressed', state.s4===1);
  mold.classList.toggle('mold-released', state.s4>=2);
  moldReveal.classList.toggle('stage-one', state.s4===1);
  moldReveal.classList.toggle('stage-two', state.s4>=2);
  moldStateNote.classList.toggle('show', state.s4>=2);
  steamer.classList.toggle('fire-on', state.s5.fire);
  steamer.classList.toggle('opened', state.s5.lid);
  steamReveal.classList.toggle('show', state.s5.lid);
  steamStateNote.classList.toggle('show', state.s5.lid);
  fire.textContent=state.s5.fire?'✓':'✦'; fire.classList.toggle('done', state.s5.fire);
  lid.textContent=state.s5.lid?'✓':'✦'; lid.classList.toggle('done', state.s5.lid);
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
const data=[
 {scene:'s1',title:'壹 · 采撷桂英',lead:'从枝头开始。轻取桂英，作为广寒糕的第一味花香。',quote:'采桂英',task:'点击左侧桂花枝，让花落入竹篮。'},
 {scene:'s2',title:'贰 · 去蒂洒水',lead:'摘去青蒂，再以甘草水轻洒花英。',quote:'去青蒂，洒以甘草水',task:'依次完成“去青蒂”和“洒甘草水”。'},
 {scene:'s3',title:'叁 · 和米舂粉',lead:'桂花与白米同入石臼，舂捣成粉，花香与米香由此相合。',quote:'和米舂粉',task:'点击石臼 3 次，完成舂粉。'},
 {scene:'s4',title:'肆 · 入模成型',lead:'原文没有细写糕形。这里用木糕模作视觉复原，让米粉先聚成糕坯。',quote:'制作复原：承接“炊作糕”之前的成型环节',task:'点击木糕模：第一次压入，第二次脱模成型。'},
 {scene:'s5',title:'伍 · 炊作佳糕',lead:'最后以蒸炊完成糕点。白汽渐起，桂香与米香一同温润起来。',quote:'炊作糕',task:'先点燃柴火；白汽升起后，再点击蒸笼开笼。'}
];
function setScene(name){scenes.forEach(s=>s.classList.toggle('active',s.dataset.scene===name))}
function render(){
 if(state.phase==='original'){
   setScene('original'); title.textContent='从原文出发'; lead.textContent='林洪只留下寥寥数语。先读原文，再顺着这些文字，把一块广寒糕重新做出来。'; quote.innerHTML='<strong>原文依据</strong>“采桂英去青蒂，洒以甘草水，和米舂粉炊作糕。”';status.textContent='先点击“循原文制糕”，进入第一步。';status.className='task-status pending';culture.style.display='none';nextBtn.textContent='循原文制糕 →';nextBtn.disabled=false;prevBtn.textContent='← 识名物';steps.forEach(s=>{s.className='step locked'});progress.forEach((p,i)=>p.classList.toggle('on',i===0));syncVisuals();return;
 }
 if(state.phase==='complete'){
   setScene('complete'); title.textContent='糕已成 · 香意未尽'; lead.textContent='五步完成。广寒糕不只是一道桂花糕，它还承载着宋人关于“高甲”的好意头。';quote.innerHTML='<strong>原文依据</strong>“大比岁，士友咸作饼子相馈，取‘广寒高甲’之谶。”';status.textContent='本章制作体验已完成。';status.className='task-status';culture.style.display='block';nextBtn.textContent='进入第三章 · 读故事 →';nextBtn.disabled=false;prevBtn.textContent='← 回看第五步';steps.forEach((s,i)=>{s.className='step complete'; if(i===4)s.classList.add('active')});progress.forEach(p=>p.classList.add('on'));syncVisuals();return;
 }
 const i=state.step,d=data[i];setScene(d.scene);title.textContent=d.title;lead.textContent=d.lead;quote.innerHTML='<strong>原文依据</strong>'+d.quote;culture.style.display='none';
 steps.forEach((s,idx)=>{s.className='step';if(idx===i)s.classList.add('active');if(state.completed[idx])s.classList.add('complete');if(idx>i && !state.completed[idx-1])s.classList.add('locked')});progress.forEach((p,idx)=>p.classList.toggle('on',idx<=i));
 const done=state.completed[i];status.textContent=done?'本步已完成，可以继续。':d.task;status.className='task-status'+(done?'':' pending');nextBtn.textContent=i===4?'完成广寒糕 →':'下一步 →';nextBtn.disabled=!done;prevBtn.textContent=i===0?'← 查看原文':'← 上一步';syncVisuals();
}
function finishStep(i){state.completed[i]=true;document.querySelector('[data-scene="'+data[i].scene+'"]').classList.add('done');render()}
function goStep(i){state.phase='steps';state.step=Math.max(0,Math.min(4,i));render()}

<script>
const pagesData = [
  {
    type: "hero",
    lines: [
      "一味桂花 何以动人",
      "生于清秋 不争春色",
      "花虽细小 香却悠远"
    ]
  },
  {
    type: "topic",
    topic: "入馔",
    lines: [
      "因时采撷 和米为糕",
      "一缕秋香进入饮食",
      "一味广寒糕 也寄着“高甲”之愿"
    ]
  },
  {
    type: "topic",
    topic: "归心",
    lines: [
      "桂香入食 也入人心",
      "可以赠友 可以寄愿",
      "也随着诗句 留在人的记忆里"
    ]
  },
  {
    type: "topic",
    topic: "风骨 · 悠远",
    lines: [
      "不争 而自有风骨",
      "微小 却可以悠远",
      "李清照说“自是花中第一流”",
      "杨万里写“一点香 吹得满山开”"
    ]
  },
  {
    type: "final",
    lines: [
      "因时入馔 · 因味归心",
      "今人食一味桂糕",
      "亦可循香入秋",
      "在一花一食之间 得片刻从容",
      "山花可赏 清供可尝",
      "且共从容"
    ],
    isFinal: true,
    isClosing: true
  }
];

let currentIndex = 0;
let currentLine = -1;
let animationTimers = [];
let autoAdvanceTimer = null;
let transitionLocked = false;

const poemBox = document.getElementById("poemBox");
const dockBar = document.getElementById("dockBar");
const finishScreen = document.getElementById("finishScreen");
const stage = document.getElementById("stage");

function clearTimers() {
  animationTimers.forEach(clearTimeout);
  animationTimers = [];
  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = null;
}

function renderDots() {
  dockBar.innerHTML = "";
  pagesData.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dock-dot" + (i === currentIndex ? " active" : "");
    dockBar.appendChild(dot);
  });
}

function buildPage() {
  clearTimers();
  transitionLocked = false;
  currentLine = -1;

  const data = pagesData[currentIndex];
  poemBox.classList.toggle("final-page", !!data.isFinal);
  poemBox.classList.toggle("closing-page", !!data.isClosing);
  const calmLevels = [1, .82, .64, .46, .24];
  const calm = calmLevels[currentIndex] ?? .24;
  document.getElementById("petalCanvas").style.opacity = calm;
  document.querySelector(".mountain-bg").style.opacity = currentIndex >= 4 ? ".035" : ".07";
  document.querySelector(".ambient-glow").style.opacity = currentIndex >= 4 ? ".58" : "1";

  const blocks = [];
  if (data.type === "topic" && data.topic) {
    blocks.push(`<p class="poem-line topic-line" id="line-topic">${data.topic}</p>`);
  }

  data.lines.forEach((line, i) => {
    let extraClass = "";
    if ((data.type === "hero" || data.type === "final") && i === 0) {
      extraClass = "hero-line";
    } else if (data.type === "final" && i === data.lines.length - 1) {
      extraClass = "closing-line";
    } else if (i === data.lines.length - 1) {
      extraClass = "last-line";
    }
    blocks.push(`<p class="poem-line ${extraClass}" id="line-${i}">${line}</p>`);
  });

  poemBox.innerHTML = blocks.join("");
  renderDots();

  // If a topic word exists, let it appear first, then start the sentences.
  if (data.type === "topic" && data.topic) {
    animationTimers.push(setTimeout(() => {
      document.getElementById("line-topic")?.classList.add("show");
    }, 420));
    animationTimers.push(setTimeout(() => revealNextLine(), 1800));
  } else {
    animationTimers.push(setTimeout(() => revealNextLine(), 650));
  }
}

function revealNextLine(force = false) {
  clearTimeout(autoAdvanceTimer);
  const data = pagesData[currentIndex];

  if (currentLine < data.lines.length - 1) {
    currentLine++;
    const line = document.getElementById(`line-${currentLine}`);
    line?.classList.add("show");

    // Normal automatic rhythm: title / first sentence stays slightly longer.
    let wait = 2250;
    if (currentLine === 0 && (data.type === "hero" || data.type === "final")) wait = 2700;
    else if (currentLine >= 1) wait = 1950;

    autoAdvanceTimer = setTimeout(() => revealNextLine(), wait);
    return;
  }

  // This page is fully visible. Pause before automatically turning the page.
  const isLastPage = currentIndex === pagesData.length - 1;
  const pause = isLastPage ? 5600 : (data.isFinal ? 4600 : 3400);
  autoAdvanceTimer = setTimeout(() => {
    if (isLastPage) showFinish();
    else goToPage(currentIndex + 1);
  }, pause);
}

function goToPage(targetIndex) {
  if (transitionLocked) return;
  if (targetIndex < 0 || targetIndex >= pagesData.length) return;

  transitionLocked = true;
  clearTimers();
  poemBox.classList.add("out");

  setTimeout(() => {
    currentIndex = targetIndex;
    poemBox.classList.remove("out");
    buildPage();
  }, 520);
}

function handleAdvanceClick() {
  if (transitionLocked || finishScreen.classList.contains("show")) return;

  const data = pagesData[currentIndex];

  // If there are hidden sentences left, a click immediately reveals the next sentence.
  if (currentLine < data.lines.length - 1) {
    clearTimeout(autoAdvanceTimer);
    revealNextLine(true);
    return;
  }

  // If the whole page is already visible, a click goes straight to the next page.
  if (currentIndex === pagesData.length - 1) showFinish();
  else goToPage(currentIndex + 1);
}

function showFinish() {
  clearTimers();
  finishScreen.classList.add("show");
}

// Main interaction: automatic playback + click-to-accelerate.
stage.addEventListener("click", handleAdvanceClick);
stage.addEventListener("touchend", (e) => {
  e.preventDefault();
  handleAdvanceClick();
}, { passive:false });

// Keep wheel and keyboard only as secondary controls.
let isWheeling = false;
document.addEventListener("wheel", (e) => {
  if (isWheeling || finishScreen.classList.contains("show")) return;
  isWheeling = true;
  if (e.deltaY > 20) handleAdvanceClick();
  else if (e.deltaY < -20 && currentIndex > 0) goToPage(currentIndex - 1);
  setTimeout(() => isWheeling = false, 600);
}, { passive:true });

document.addEventListener("keydown", (e) => {
  if (finishScreen.classList.contains("show")) return;
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    handleAdvanceClick();
  }
  if (e.key === "ArrowLeft" && currentIndex > 0) {
    goToPage(currentIndex - 1);
  }
});

// End-screen navigation.
// When embedded in the complete atlas, these hooks can be intercepted by the parent page.
// Standalone preview falls back to a hash / reload-friendly behavior.
document.getElementById("backPoetryBtn")?.addEventListener("click", () => {

    window.SJQShow("poetry");
    return;

    return;

  history.back();
});

document.getElementById("backIndexBtn")?.addEventListener("click", () => {
  if (typeof window.SJQShow === "function") {
    window.SJQShow("identify");
    return;
  }
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({type:"sjq-section", section:"identify"}, "*");
    return;
  }
  location.hash = "identify";
  location.reload();
});

// ===== 桂花四瓣小花缓落特效 Canvas =====
const canvas = document.getElementById("petalCanvas");
const ctx = canvas.getContext("2d");
let petals = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class Petal {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -20;
    this.size = Math.random() * 3.5 + 3.2;
    this.speedY = Math.random() * 0.34 + 0.18;
    this.speedX = Math.random() * 0.26 - 0.13;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = (Math.random() - 0.5) * 0.008;
    this.opacity = Math.random() * 0.22 + 0.10;
    const colors = [
      'rgba(220, 172, 73, ',
      'rgba(232, 190, 95, ',
      'rgba(244, 210, 135, '
    ];
    this.colorBase = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.y += this.speedY;
    this.x += Math.sin(this.y * 0.01) * 0.35 + this.speedX;
    this.angle += this.spin;
    if (this.y > canvas.height + 20) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.colorBase + this.opacity + ')';
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI / 2);
      ctx.beginPath();
      ctx.ellipse(0, -this.size * 0.82, this.size * 0.48, this.size * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, this.size * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(154,104,36,' + Math.min(this.opacity + .12, .45) + ')';
    ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < 14; i++) {
  const p = new Petal();
  p.y = Math.random() * canvas.height;
  petals.push(p);
}

function animatePetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animatePetals);
}
animatePetals();

buildPage();

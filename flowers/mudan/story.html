<script>
(() => {
  const STORIES=[
    {title:'清供有度',sub:'一盘清供，见宫中冬日的节制与雅意。',tag:'《山家清供》· 原文记载',source:'——《山家清供·牡丹生菜》',insight:['“恭俭”先于菜名，说明这段记载关注的也是人的品行与日常尺度。','花瓣只略焯，动作很轻，保留的是牡丹本身的清芬。','“清且洁”既说滋味，也说一种不铺张的生活趣味。'],scenes:[
      {label:'冬日入膳',hint:'宪圣吴太后性恭俭，冬月以牡丹生菜供御。',image:'assets/story-clear-01-winter-room.png',classical:'宪圣吴太后，性恭俭，每至冬月，必以牡丹生菜供御。',plain:'宪圣吴太后生性恭敬俭朴，每到冬天，一定把牡丹生菜供给宫中食用。'},
      {label:'一枝清供',hint:'花与器物相对，山野的清气进入日常。',image:'assets/story-clear-02-simple-table.png',classical:'其法：采牡丹花瓣，略以汤焯之。',plain:'做法是：采摘牡丹花瓣，略微用热水焯一下。'},
      {label:'清且洁',hint:'花与生菜相和，清雅成为一餐的意味。',image:'assets/story-clear-03-clear-table.png',classical:'用五味调匀，同生菜食之。盖取其清且洁也。',plain:'再用各种调味料调匀，和生菜一起吃。大概是取牡丹清爽洁净的意味。'}
    ]},
    {title:'守节不开',sub:'一则传说，讲牡丹如何守住自己的时令。',tag:'古籍记载 · 民间传说',source:'——《事物纪原》等古籍记载，后演绎为民间传说',insight:['传说从冬令起笔，把牡丹放在时节与权力的张力中。','“守节不开”是故事的转折：花期不能因诏令而改变。','洛阳的结局把拒绝写成了名声，留下牡丹傲骨的想象。'],scenes:[
      {label:'冬令游苑',hint:'雪落后苑，武后下诏：百花齐放。',image:'assets/story-legend-01-winter-buds.png',classical:'武后冬月游后苑，诏百花齐放。',plain:'武则天在冬天游览后苑，下令百花一齐开放。'},
      {label:'惟牡丹不开',hint:'众花争妍，只有牡丹仍把花期留在春天。',image:'assets/story-legend-02-command.png',classical:'众花皆畏其威，竞相争妍。惟牡丹独不奉诏，守节不开。',plain:'众花都害怕她的威势，争相开放；只有牡丹独自不奉诏令，坚持不开花。'},
      {label:'贬至洛阳',hint:'离开宫苑之后，牡丹在洛阳重新盛放。',image:'assets/story-legend-03-luoyang.png',classical:'后怒，贬之洛阳。故今洛阳牡丹冠绝天下，不负其傲骨之名。',plain:'她因此发怒，把牡丹贬到洛阳。所以如今洛阳的牡丹冠绝天下，也不辜负它傲骨的名声。'}

  const tabs=[...document.querySelectorAll('.story-tab')],progress=[...document.querySelectorAll('.story-progress i')],image=document.getElementById('storyImage'),title=document.getElementById('storyTitle'),subtitle=document.getElementById('storySubtitle'),tag=document.getElementById('sourceTag'),readText=document.getElementById('readText'),readSource=document.getElementById('readSource'),insight=document.getElementById('insight'),count=document.getElementById('visualCount'),sceneLabel=document.getElementById('sceneLabel'),sceneHint=document.getElementById('sceneHint'),sceneNext=document.getElementById('sceneNext'),sceneTabs=[...document.querySelectorAll('[data-scene]')],nextBtn=document.getElementById('nextBtn'),prevBtn=document.getElementById('prevBtn'),toast=document.getElementById('toast');

  function render(){const story=STORIES[state.current],scene=story.scenes[state.scene];tabs.forEach((tab,i)=>{tab.classList.toggle('active',i===state.current);tab.classList.toggle('visited',state.visited.has(i))});progress.forEach((bar,i)=>bar.classList.toggle('on',state.visited.has(i)));sceneTabs.forEach((btn,i)=>{btn.classList.toggle('active',i===state.scene);btn.classList.toggle('done',i<state.scene)});image.classList.remove('active');setTimeout(()=>{image.src=scene.image;image.alt=scene.hint;image.classList.add('active')},100);title.textContent=story.title;subtitle.textContent=story.sub;tag.textContent=story.tag;readText.textContent=state.read==='classical'?scene.classical:scene.plain;readSource.textContent=state.read==='classical'?story.source:'白话释义';insight.textContent=story.insight[state.scene];count.textContent=`0${state.scene+1} / 03`;sceneLabel.textContent=scene.label;sceneHint.textContent=scene.hint;sceneNext.textContent=state.scene<2?'继续 →':state.current===0?'下一则故事 →':'故事读完';nextBtn.disabled=false;nextBtn.textContent=state.scene<2?'继续 →':state.current===0?'下一则故事 →':state.visited.size===2?'进入第四章 · 赏诗词 →':'故事读完'}
  function goScene(index){state.scene=Math.max(0,Math.min(2,index));render()}
  tabs.forEach((tab,i)=>tab.addEventListener('click',()=>{state.current=i;state.scene=0;state.visited.add(i);render()}));sceneTabs.forEach((btn,i)=>btn.addEventListener('click',()=>goScene(i)));sceneNext.addEventListener('click',()=>{if(state.scene<2){goScene(state.scene+1);return}if(state.current===0){state.current=1;state.scene=0;state.visited.add(1);render();return}showToast('两则故事已经读完。')});
  document.querySelectorAll('[data-read]').forEach(btn=>btn.addEventListener('click',()=>{state.read=btn.dataset.read;document.querySelectorAll('[data-read]').forEach(b=>{const active=b.dataset.read===state.read;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});render()}));
  prevBtn.addEventListener('click',()=>{window.location.href='recipe.html'});nextBtn.addEventListener('click',()=>{if(state.scene<2){goScene(state.scene+1);return}if(state.current===0){state.current=1;state.scene=0;state.visited.add(1);render();return}window.location.href='poetry.html'});
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.getAttribute('aria-disabled')==='true'){showToast('该章节尚未接入。');return}if(btn.dataset.href){window.location.href=btn.dataset.href}}));
  render();
})();
</script>
</body>
</html>

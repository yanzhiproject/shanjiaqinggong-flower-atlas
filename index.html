<style>
:root{--paper:#F7F1E7;--paper-soft:#FBF8F2;--card:#FFFDF8;--ink:#40382E;--muted:#8B7965;--gold:#C79F5D;--gold-light:#DFBD82;--green:#6F7959;--line:rgba(199,159,93,.20);--line-strong:rgba(199,159,93,.34);--shadow:0 16px 38px rgba(85,65,31,.08);--shadow-soft:0 9px 22px rgba(85,65,31,.06);--radius-card:24px;--radius-pill:999px;--header-h:76px;--fast:180ms;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;--title:"STKaiti","KaiTi","FangSong","Noto Serif SC",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:var(--serif);overflow:hidden}button,a{font:inherit}
.opening-shell{position:fixed;inset:0;z-index:40;background:var(--paper);transition:opacity var(--fast) ease-out,visibility var(--fast) ease-out}.opening-shell.done{opacity:0;visibility:hidden;pointer-events:none}.opening-shell iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
.site{height:100dvh;display:grid;grid-template-rows:var(--header-h) 1fr}.topbar{display:grid;grid-template-columns:minmax(210px,1fr) auto minmax(140px,1fr);align-items:center;padding:0 38px;border-bottom:1px solid var(--line);background:var(--paper-soft)}.brand{font-size:18px;letter-spacing:.08em}.nav-pill{padding:11px 28px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);color:var(--muted);letter-spacing:.1em;background:var(--card);box-shadow:var(--shadow-soft)}.season{justify-self:end;color:var(--gold);font-size:14px;letter-spacing:.12em}.atlas{min-height:0;padding:clamp(24px,4vh,44px) clamp(28px,4vw,68px) 30px;display:flex;flex-direction:column;justify-content:center}.intro{text-align:center;margin-bottom:clamp(22px,3.4vh,38px)}.intro .eyebrow{color:var(--gold);letter-spacing:.2em;font-size:14px}.intro h2{font:400 clamp(38px,3.4vw,44px)/1.15 var(--title);letter-spacing:.16em;margin:12px 0;text-wrap:balance}.intro p{color:var(--muted);font-size:16px;line-height:1.85;letter-spacing:.04em;margin:0;text-wrap:pretty}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;max-width:1640px;width:100%;margin:0 auto}.flower-card{position:relative;min-width:0;height:clamp(310px,46vh,420px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);transition:transform var(--fast) ease-out,box-shadow var(--fast) ease-out,border-color var(--fast) ease-out}.flower-card:hover,.flower-card:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--gold-light);outline:none}.flower-card svg{width:min(145px,55%);height:160px;overflow:visible;transition:transform var(--fast) ease-out}.flower-card:hover svg,.flower-card:focus-visible svg{transform:scale(1.03)}.flower-card h3{font:400 34px/1 var(--title);letter-spacing:.1em;margin:20px 0 9px}.flower-card p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.08em}.flower-card span{position:absolute;bottom:20px;color:var(--gold);font-size:13px;opacity:0;transform:translateY(4px);transition:opacity var(--fast) ease-out,transform var(--fast) ease-out}.flower-card:hover span,.flower-card:focus-visible span{opacity:1;transform:none}
@media(max-width:1279px){body{overflow:auto}.site{height:auto;min-height:100dvh}.cards{grid-template-columns:repeat(3,1fr)}.flower-card{height:330px}.topbar{padding:0 18px}.nav-pill{padding-inline:20px}}
@media(max-width:767px){.topbar{grid-template-columns:1fr auto}.nav-pill{display:none}.cards{grid-template-columns:1fr}.atlas{justify-content:flex-start;padding:28px 18px}.flower-card{height:290px}.intro h2{font-size:38px}.season{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.flower-card:hover,.flower-card:focus-visible{transform:none}}
</style>
</head>

<script>
const openingShell=document.getElementById('openingShell');
function closeOpening(){if(!openingShell)return;sessionStorage.setItem('sjq-opening-seen','1');openingShell.classList.add('done');window.setTimeout(()=>openingShell.remove(),200)}
window.addEventListener('message',event=>{if(event.source===openingShell?.querySelector('iframe')?.contentWindow&&event.data?.type==='sjq-opening-complete')closeOpening()});
if(new URLSearchParams(location.search).has('home')||sessionStorage.getItem('sjq-opening-seen'))openingShell.remove();
</script>

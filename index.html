<style>
:root{--paper:#f8f3e8;--surface:#fffdf8;--ink:#3e372e;--muted:#8e806f;--gold:#d4a44f;--line:#ead9bb;--green:#75835c;--shadow:0 22px 55px rgba(91,70,40,.11)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:"Songti SC","Noto Serif SC","STSong",serif;overflow:hidden}
button,a{font:inherit}.opening{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#fffdf8 0 20%,#f8f0df 54%,#efe2c8 100%);transition:opacity .8s ease,visibility .8s ease}.opening.done{opacity:0;visibility:hidden;pointer-events:none}.opening-inner{text-align:center;width:min(850px,86vw)}.opening-mark{width:210px;height:210px;margin:auto;position:relative}.opening-core{position:absolute;inset:70px;border-radius:50%;background:#c9973f;box-shadow:0 0 0 1px #bd8d3b}.petal{position:absolute;left:91px;top:17px;width:28px;height:83px;border-radius:55% 55% 48% 48%;transform-origin:14px 88px;background:linear-gradient(#f2d79c,#d9ab55);animation:breathe 2.4s ease-in-out infinite alternate}.opening h1{font-family:"STKaiti","KaiTi",serif;font-weight:400;font-size:clamp(42px,5vw,70px);letter-spacing:.22em;margin:20px 0 14px}.opening p{color:var(--muted);font-size:18px;letter-spacing:.15em}.opening button{margin-top:28px;border:1px solid var(--line);background:rgba(255,253,248,.9);color:var(--ink);border-radius:999px;padding:13px 28px;cursor:pointer}.opening button:hover{background:var(--gold);color:white}
@keyframes breathe{to{filter:brightness(1.08);transform:var(--r) scaleY(1.05)}}
.site{height:100vh;display:grid;grid-template-rows:76px 1fr}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 38px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.92)}.brand{font-size:20px;letter-spacing:.08em}.nav-pill{padding:11px 28px;border:1px solid var(--line);border-radius:999px;color:var(--muted);letter-spacing:.12em;background:var(--surface)}.season{justify-self:end;color:#b18b51;font-size:14px;letter-spacing:.12em}.atlas{min-height:0;padding:clamp(24px,4vh,48px) clamp(28px,4vw,68px) 30px;display:flex;flex-direction:column;justify-content:center}.intro{text-align:center;margin-bottom:clamp(22px,4vh,42px)}.intro .eyebrow{color:#c28f3f;letter-spacing:.2em;font-size:14px}.intro h2{font:400 clamp(42px,4.2vw,62px)/1.1 "STKaiti","KaiTi",serif;letter-spacing:.18em;margin:12px 0}.intro p{color:var(--muted);font-size:16px;letter-spacing:.08em;margin:0}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;max-width:1640px;width:100%;margin:0 auto}.flower-card{position:relative;min-width:0;height:clamp(310px,46vh,440px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 30px rgba(95,76,48,.07);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}.flower-card:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:#d8b978}.flower-card svg{width:min(145px,55%);height:160px;overflow:visible;transition:transform .35s ease}.flower-card:hover svg{transform:scale(1.05)}.flower-card h3{font:400 34px/1 "STKaiti","KaiTi",serif;letter-spacing:.12em;margin:20px 0 9px}.flower-card p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.12em}.flower-card span{position:absolute;bottom:20px;color:#b08a50;font-size:13px;opacity:0;transform:translateY(5px);transition:.25s}.flower-card:hover span{opacity:1;transform:none}
@media(max-width:1100px){body{overflow:auto}.site{height:auto;min-height:100vh}.cards{grid-template-columns:repeat(3,1fr)}.flower-card{height:330px}.topbar{padding:0 18px}}@media(max-width:700px){.topbar{grid-template-columns:1fr auto}.nav-pill{display:none}.cards{grid-template-columns:1fr 1fr}.atlas{justify-content:flex-start}.flower-card{height:290px}.opening h1{letter-spacing:.1em}}
</style>
</head>

<script>
const opening=document.getElementById('opening');for(let i=0;i<10;i++){const p=document.createElement('i');p.className='petal';p.style.setProperty('--r',`rotate(${i*36}deg)`);p.style.transform=`rotate(${i*36}deg)`;p.style.animationDelay=`${i*.07}s`;flowerMark.appendChild(p)}
function closeOpening(){opening.classList.add('done');sessionStorage.setItem('sjq-opening-seen','1')}
document.getElementById('enter').addEventListener('click',closeOpening);opening.addEventListener('click',e=>{if(e.target===opening)closeOpening()});
if(new URLSearchParams(location.search).has('home')||sessionStorage.getItem('sjq-opening-seen'))opening.classList.add('done');
</script>
